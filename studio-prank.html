<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Prank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1FF; --card:#FFFFFF; --ink:#1B1340; --muted:#5B5680; --line:#D5D9F5;
  --pink:#FF3D81; --yellow:#FFD60A; --mint:#19C37D;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.1}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
header{padding:28px 16px 8px;max-width:760px;margin:0 auto}
header h1{font-size:clamp(40px,11vw,68px);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:14px}
.rec{width:.42em;height:.42em;border-radius:50%;background:var(--pink);flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
header p{margin:10px 0 0;color:var(--muted);max-width:46ch}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px;display:grid;gap:16px}
section.box{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px}
section.box h2{font-size:22px;font-weight:800;margin-bottom:4px}
.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
label.f{display:block;font-weight:600;margin:14px 0 6px}
textarea,input[type=password],input[type=text]{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
textarea:focus,input:focus,button:focus-visible,.drop:focus-within{outline:3px solid var(--pink);outline-offset:2px;border-color:var(--ink)}
.row{display:flex;gap:8px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;border:2px dashed var(--ink);border-radius:14px;padding:22px 14px;cursor:pointer;background:#F7F8FF}
.drop strong{font-family:'Bricolage Grotesque',sans-serif;font-size:18px}
.drop span{color:var(--muted);font-size:14px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--ink);background:#ddd}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);font-weight:800;line-height:1;cursor:pointer;padding:0}
.btn{font:inherit;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;border:2px solid var(--ink);border-radius:14px;padding:14px 18px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.6;cursor:wait}
.small{font:inherit;font-weight:600;font-size:14px;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;background:#fff;color:var(--ink);cursor:pointer}
.status{min-height:22px;font-size:14px;color:var(--muted);margin-top:10px}
.status.err{color:#B3123F;font-weight:600}
#results{display:grid;gap:16px}
.analyse{background:var(--yellow);border:2px solid var(--ink);border-radius:18px;padding:16px}
.analyse h2{font-size:20px;margin-bottom:6px}
.analyse p{margin:6px 0 0}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;overflow:hidden}
.card header{padding:16px 16px 0;margin:0;max-width:none}
.card h3{font-size:22px;font-weight:800}
.change{margin:6px 0 0;color:var(--muted);font-size:14px}
.hook{margin:14px 16px 0;padding:14px;background:var(--ink);color:#fff;border-radius:14px;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:500;line-height:1.25}
.card .body{padding:6px 16px 16px}
.card h4{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;margin:16px 0 4px;color:var(--pink);font-weight:800}
.card ol{margin:0;padding-left:20px}
.card ol li{margin:4px 0}
.card p{margin:0}
.copy{margin-top:16px}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.rec{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<header>
  <h1><span class="rec" aria-hidden="true"></span>Studio Prank</h1>
  <p>Donne une inspiration, récupère des déclinaisons pensées pour faire du contenu viral.</p>
</header>

<main>
  <section class="box">
    <h2>Clé Vertex</h2>
    <p class="sub">Enregistrée uniquement sur cet appareil.</p>
    <div class="row">
      <input id="apiKey" type="password" autocomplete="off" placeholder="Clé API Vertex" aria-label="Clé API Vertex">
      <button class="small" id="toggleKey" type="button">Voir</button>
    </div>
  </section>

  <section class="box">
    <h2>Inspiration</h2>
    <p class="sub">Screenshots facultatifs (10 maximum), puis décris la situation.</p>
    <label class="drop" id="drop">
      <strong>Ajouter des screenshots</strong>
      <span>Facultatif</span>
      <input id="files" type="file" accept="image/*" multiple>
    </label>
    <div class="thumbs" id="thumbs"></div>

    <label class="f" for="situation">Situation vue</label>
    <textarea id="situation" rows="4" placeholder="Ce qui se passe dans le prank que tu as vu"></textarea>

    <label class="f" for="infos">Informations complémentaires</label>
    <textarea id="infos" rows="3" placeholder="Le contexte, ce que tu veux garder ou changer, le couple, le lieu…"></textarea>

    <div style="margin-top:18px">
      <button class="btn" id="go" type="button">Générer les déclinaisons</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <div id="results"></div>
</main>

<script>
(function(){
'use strict';

var MODEL = 'gemini-3.8-flash';
var ENDPOINT = 'https://aiplatform.googleapis.com/v1/publishers/google/models/' + MODEL + ':generateContent';
var MAX_IMAGES = 10;
var NB_DECLINAISONS = 6;

var SYSTEM = [
"Tu es le moteur de Studio Prank. Tu es expert de la viralité des pranks de couple sur TikTok et Instagram Reels. Ta mission : à partir d'une inspiration (screenshots et/ou description), proposer des déclinaisons à fort potentiel viral, que deux personnes peuvent tourner avec un téléphone.",
"",
"CODES DE VIRALITÉ À APPLIQUER",
"- Le hook décide de tout : la première seconde doit montrer le problème, la tension ou le moment de la prise de conscience. Les plateformes mesurent combien de gens restent après 1 à 3 secondes, puis combien regardent jusqu'au bout.",
"- Le prank compte moins que la réaction : la surprise, la confusion, l'indignation ou le soulagement sincères font regarder jusqu'à la fin et partager.",
"- Une seule émotion principale par vidéo, construite jusqu'à la chute.",
"- La vidéo doit se comprendre sans le son : un sujet par plan, texte à l'écran lisible dès le début.",
"- Format court, 15 à 40 secondes, avec une chute nette et un contraste clair entre deux comportements (le plus engagé contre le plus réservé, le calme contre la panique).",
"- Les formats qui marchent déjà sont repris puis tordus : un format connu avec un twist neuf passe mieux qu'une idée inconnue.",
"- Ce qui fait commenter et partager : une situation que chacun reconnaît chez son couple, un camp à choisir, la mention « envoie ça à ton conjoint », la revanche ou le retour de bâton en suite.",
"- Le duo piégeur / victime patiente est un ressort fort, tout comme le renversement de rôles et la suite « il/elle se venge ».",
"",
"FORMATS DE COUPLE QUI CIRCULENT EN CE MOMENT (automne 2026)",
"- Porte qui se ferme : l'un court vers l'embrasure, l'autre fait mine de claquer la porte au dernier moment, le réflexe fait le clip (tendance de fin octobre 2026).",
"- Mousse à raser : un partenaire croit faire une tendance de couple et se couvre entièrement, l'autre n'en met qu'une touche et révèle le piège.",
"- « Besides the obvious… » : on filme son partenaire et on demande ce qu'il changerait chez lui à part l'évidence, la réaction est le contenu.",
"- Changer la question : poser une question puis en glisser une autre à la dernière seconde.",
"- « Mon copain actuel » : présenter son conjoint comme son copain actuel face caméra.",
"- Faux hug : une inconnue le prend dans ses bras comme une vieille amie.",
"- Photos IA de la maison : une personne en trop glissée dans une photo du salon, envoyée par message.",
"- « Look… » : deux personnes aux réactions contrastées, une peur exagérée puis une seconde, plus personnelle, qui retourne la situation.",
"- « Je ne te l'ai jamais dit » : un compliment qui tourne au relooking absurde.",
"- Permission : demander l'autorisation de commander, avec un deux poids deux mesures qui éclate à la fin.",
"- Faux scénario crédible : faux extrait d'actualité, faux message, fausse annonce.",
"- Slapstick maison : objet qui éclate, œufs, farine, faux insecte, faux fantôme.",
"- Jeux sur l'ex, le téléphone, les messages, les colis.",
"",
"MÉTHODE",
"1. Analyse d'abord le mécanisme de l'inspiration : ce qui se passe, et pourquoi ça fonctionne (hook, émotion, contraste, chute). Décris seulement ce qui est visible ou écrit dans les éléments fournis, sans rien inventer. Ne décris jamais l'aspect physique des personnes (visage, cheveux, expression) ni leurs vêtements : seulement leur présence et leurs actions.",
"2. Décline : garde le mécanisme qui fait marcher l'idée et change le reste. Aucune copie de l'inspiration. Chaque déclinaison part d'un angle différent : autre lieu, autre déclencheur, autre objet, rôles inversés, escalade, suite revanche, version par message ou téléphone, version photo IA, version à trois, version avec un invité.",
"3. Chaque déclinaison est concrète et tournable : on sait quoi dire, quoi faire, quoi filmer, quel texte afficher.",
"4. Tout est rédigé en français. Si des répliques sont fournies par l'utilisatrice, reprends-les telles quelles.",
"",
"FORMAT DE SORTIE : un seul objet JSON valide, sans texte autour, de cette forme exacte :",
"{",
"  \"analyse\": { \"mecanisme\": \"ce qui se passe dans l'inspiration en deux phrases\", \"ressort_viral\": \"pourquoi ça fonctionne en deux phrases\" },",
"  \"declinaisons\": [",
"    {",
"      \"titre\": \"titre court\",",
"      \"ce_qui_change\": \"ce qui est différent de l'inspiration en une phrase\",",
"      \"hook\": \"ce qui se voit et se dit pendant la première seconde\",",
"      \"deroule\": [\"étape 1\", \"étape 2\", \"étape 3\", \"étape 4\"],",
"      \"reaction\": \"la réaction et la chute attendues\",",
"      \"pourquoi_viral\": \"le mécanisme qui fait regarder, commenter et partager\",",
"      \"texte_ecran\": \"le texte à afficher à l'écran\",",
"      \"legende\": \"la légende du post\"",
"    }",
"  ]",
"}"
].join("\n");

var $ = function(id){ return document.getElementById(id); };
var images = []; // {id, url, dataUrl}
var uid = 0;

/* ---------- clé ---------- */
try { var saved = localStorage.getItem('studio_prank_key'); if (saved) $('apiKey').value = saved; } catch(e){}
$('apiKey').addEventListener('input', function(){
  try { localStorage.setItem('studio_prank_key', $('apiKey').value.trim()); } catch(e){}
});
$('toggleKey').addEventListener('click', function(){
  var k = $('apiKey');
  var show = k.type === 'password';
  k.type = show ? 'text' : 'password';
  this.textContent = show ? 'Masquer' : 'Voir';
});

/* ---------- images ---------- */
function setStatus(msg, isErr){
  var s = $('status');
  s.textContent = msg || '';
  s.className = 'status' + (isErr ? ' err' : '');
}

function fileToJpegDataUrl(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var max = 1280, w = img.naturalWidth, h = img.naturalHeight;
      var r = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * r); c.height = Math.round(h * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('Image illisible : ' + file.name)); };
    img.src = url;
  });
}

function renderThumbs(){
  var box = $('thumbs');
  box.innerHTML = '';
  images.forEach(function(im){
    var d = document.createElement('div'); d.className = 'thumb';
    var i = document.createElement('img'); i.src = im.dataUrl; i.alt = 'Screenshot ajouté';
    var b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Retirer ce screenshot');
    b.addEventListener('click', function(){
      images = images.filter(function(x){ return x.id !== im.id; });
      renderThumbs();
    });
    d.appendChild(i); d.appendChild(b); box.appendChild(d);
  });
}

$('files').addEventListener('change', function(e){
  var list = Array.prototype.slice.call(e.target.files || []);
  e.target.value = '';
  var room = MAX_IMAGES - images.length;
  if (list.length > room) { setStatus('Maximum ' + MAX_IMAGES + ' screenshots.', true); list = list.slice(0, Math.max(room, 0)); }
  Promise.all(list.map(function(f){
    return fileToJpegDataUrl(f).then(function(d){ return {id: ++uid, dataUrl: d}; });
  })).then(function(added){
    images = images.concat(added);
    renderThumbs();
  }).catch(function(err){ setStatus(err.message, true); });
});

/* ---------- appel Vertex ---------- */
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

async function callVertex(key, parts){
  var body = {
    systemInstruction: { parts: [{ text: SYSTEM }] },
    contents: [{ role: 'user', parts: parts }],
    generationConfig: { responseMimeType: 'application/json', temperature: 1 }
  };
  var attempt = 0, lastErr;
  while (attempt < 4){
    var res;
    try {
      res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify(body)
      });
    } catch(e){ throw new Error('Connexion impossible : ' + e.message); }
    if (res.ok){
      var data = await res.json();
      var cand = data.candidates && data.candidates[0];
      var txt = cand && cand.content && cand.content.parts
        ? cand.content.parts.map(function(p){ return p.text || ''; }).join('') : '';
      if (!txt) throw new Error('Réponse vide du modèle. Relance la génération.');
      return txt;
    }
    var detail = '';
    try { var j = await res.json(); detail = (j.error && j.error.message) || ''; } catch(e){}
    lastErr = new Error('Erreur ' + res.status + (detail ? ' : ' + detail : ''));
    if (res.status === 429 || res.status === 503){
      attempt++;
      setStatus('Serveur saturé, nouvelle tentative (' + attempt + '/3)…');
      await sleep(Math.pow(2, attempt) * 1500);
      continue;
    }
    throw lastErr;
  }
  throw lastErr;
}

function parseJson(txt){
  var t = txt.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch(e){}
  var a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new Error('Réponse illisible. Relance la génération.');
}

/* ---------- rendu ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function cardText(d){
  var steps = (d.deroule || []).map(function(s, i){ return (i + 1) + '. ' + s; }).join('\n');
  return [d.titre, '', 'Ce qui change : ' + d.ce_qui_change, '', 'Hook : ' + d.hook, '', 'Déroulé :', steps, '',
    'Réaction et chute : ' + d.reaction, '', 'Pourquoi ça devient viral : ' + d.pourquoi_viral, '',
    'Texte à l\'écran : ' + d.texte_ecran, '', 'Légende : ' + d.legende].join('\n');
}

function render(out){
  var box = $('results');
  var html = '';
  if (out.analyse){
    html += '<div class="analyse"><h2>Ce qui fait marcher l\'idée</h2>' +
      '<p>' + esc(out.analyse.mecanisme) + '</p><p>' + esc(out.analyse.ressort_viral) + '</p></div>';
  }
  (out.declinaisons || []).forEach(function(d, i){
    var steps = (d.deroule || []).map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('');
    html += '<article class="card" data-i="' + i + '">' +
      '<header><h3>' + esc(d.titre) + '</h3><p class="change">' + esc(d.ce_qui_change) + '</p></header>' +
      '<div class="hook">' + esc(d.hook) + '</div>' +
      '<div class="body">' +
      '<h4>Déroulé</h4><ol>' + steps + '</ol>' +
      '<h4>Réaction et chute</h4><p>' + esc(d.reaction) + '</p>' +
      '<h4>Pourquoi ça devient viral</h4><p>' + esc(d.pourquoi_viral) + '</p>' +
      '<h4>Texte à l\'écran</h4><p>' + esc(d.texte_ecran) + '</p>' +
      '<h4>Légende</h4><p>' + esc(d.legende) + '</p>' +
      '<button class="small copy" type="button">Copier</button>' +
      '</div></article>';
  });
  box.innerHTML = html;
  var cards = box.querySelectorAll('.card');
  Array.prototype.forEach.call(cards, function(c){
    var d = out.declinaisons[+c.getAttribute('data-i')];
    c.querySelector('.copy').addEventListener('click', function(){
      var btn = this, txt = cardText(d);
      var done = function(){ btn.textContent = 'Copié'; setTimeout(function(){ btn.textContent = 'Copier'; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
      } else { fallbackCopy(txt); done(); }
    });
  });
}

function fallbackCopy(txt){
  var t = document.createElement('textarea');
  t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(t);
}

/* ---------- génération ---------- */
$('go').addEventListener('click', async function(){
  var key = $('apiKey').value.trim();
  var situation = $('situation').value.trim();
  var infos = $('infos').value.trim();
  if (!key){ setStatus('Ajoute ta clé Vertex.', true); return; }
  if (!images.length && !situation && !infos){ setStatus('Ajoute un screenshot ou décris la situation.', true); return; }

  var parts = [];
  images.forEach(function(im){
    parts.push({ inlineData: { mimeType: 'image/jpeg', data: im.dataUrl.split(',')[1] } });
  });
  var prompt = 'Produis ' + NB_DECLINAISONS + ' déclinaisons.\n';
  if (situation) prompt += '\nSituation vue :\n' + situation + '\n';
  if (infos) prompt += '\nInformations complémentaires :\n' + infos + '\n';
  if (images.length) prompt += '\n' + images.length + ' screenshot(s) d\'inspiration joint(s).\n';
  parts.push({ text: prompt });

  var btn = this;
  btn.disabled = true;
  $('results').innerHTML = '';
  setStatus('Génération en cours…');
  try {
    var txt = await callVertex(key, parts);
    var out = parseJson(txt);
    if (!out.declinaisons || !out.declinaisons.length) throw new Error('Aucune déclinaison reçue. Relance la génération.');
    render(out);
    setStatus('');
    $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch(err){
    setStatus(err.message, true);
  } finally {
    btn.disabled = false;
  }
});

})();
</script>
</body>
</html>
