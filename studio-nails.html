<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Élégance Nails — Studio IRL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --gold:#D4AF37; --gold-l:#F9E4B7; --text:#fff; --muted:#9ca3af;
  --glass:rgba(255,255,255,.04); --line:rgba(255,255,255,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 60px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(500px 500px at 100% 0,rgba(139,0,0,.12),transparent 70%),radial-gradient(500px 500px at 0 100%,rgba(212,175,55,.07),transparent 70%)}
.serif{font-family:'Playfair Display',serif;font-style:italic}
.gold-text{background:linear-gradient(90deg,#D4AF37,#F9E4B7,#D4AF37);-webkit-background-clip:text;background-clip:text;color:transparent}
.gold-bg{background:linear-gradient(90deg,#D4AF37,#F9E4B7,#D4AF37);color:#000}
nav{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(env(safe-area-inset-top,0px) + 14px) 24px 14px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--line)}
nav .in{max-width:576px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
nav h1{font-family:'Playfair Display',serif;font-size:20px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
nav button{background:none;border:0;color:var(--muted);font-size:11px;cursor:pointer;letter-spacing:.1em}
main{max-width:576px;margin:0 auto;padding:110px 16px 0;min-height:85vh;display:flex;flex-direction:column;justify-content:center}
.center{text-align:center}
.stack>*+*{margin-top:24px}
h2.t{font-size:32px}
.eyebrow{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase}
.sub{color:var(--muted);font-weight:300;font-size:14px;margin-top:8px}
.glass{background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;font-size:13px;cursor:pointer;transition:transform .15s,opacity .2s;font-family:inherit}
.btn:active{transform:scale(.97)}

.btn.white{background:#fff;color:#000}

.hero-icon{width:96px;height:96px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:float 4s ease-in-out infinite}

.err button{margin-top:10px;background:none;border:0;border-bottom:1px solid currentColor;color:inherit;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;cursor:pointer;padding-bottom:3px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

#loader .n{color:rgba(255,255,255,.3);font-size:11px;margin-top:10px;min-height:16px}

</style>

<body>

<div id="loader">
  <div class="ring"><i class="a"></i><i class="b"></i><span>💅</span></div>
  <h3 class="serif gold-text">Préparation de votre séance…</h3>
  <p class="s">Analyse des mains &amp; application du style</p>
  <p class="n" id="loaderNote">Rendu 4K en cours, comptez 30 à 60 secondes.</p>
</div>

<nav><div class="in">
  <h1 class="gold-text" data-action="home">💅 Élégance</h1>
  <button data-action="changeKey" id="keyBtn" style="display:none">Clé API</button>
</div></nav>

<main id="app"></main>

<script>
/* =========================================================
   CONFIG — ne pas modifier les noms de modèles sans instruction
   ========================================================= */
const MODEL_IMAGE = 'gemini-3-pro-image';          // rendu 4K (même modèle que les autres studios)
const VERTEX_HOST = 'https://aiplatform.googleapis.com/v1/publishers/google/models';
const ASPECT_RATIO = '9:16';
const IMAGE_SIZE = '4K';
const MAX_RETRIES = 3;
const KEY_STORAGE = 'elegance_nails_vertex_key';

const COLORS = [
  {name:'Rouge Passion', hex:'#8B0000'},{name:'Rose Poudré', hex:'#FFB6C1'},
  {name:'Nude Beige', hex:'#DEB887'},{name:'Noir Onyx', hex:'#000000'},
  {name:'Blanc Pur', hex:'#FFFFFF'},{name:'Bleu Marine', hex:'#000080'},
  {name:'Vert Émeraude', hex:'#004d40'},{name:'Or Métallique', hex:'#D4AF37'}
];
const PRESTATIONS = ['Vernis Semi-Permanent','Gel','Résine','Gainage','Pose Complète'];
const LENGTHS = ['Court','Moyen','Long'];
const SHAPES = ['Carré','Arrondi','Amande','Coffin / Ballerine','Stiletto'];
const STYLES = ['Couleur Unie (Simple)','French','Baby Boomer','Nail Art'];

const SCENES = [
  {k:'cleaning',    t:'Nettoyage & Désinfection', d:'La manucuriste prépare vos mains dans le salon.'},
  {k:'preparation', t:'Préparation des Ongles',   d:'Limage et soin précis des cuticules.'},
  {k:'application', t:'Pose du Vernis',           d:'Application minutieuse sur vos ongles.'},
  {k:'lamp',        t:'Séchage sous Lampe UV',    d:'La main insérée dans la lampe UV allumée.'},
  {k:'finishing',   t:'Soin & Finition',          d:'Massage à l\'huile et hydratation.'},
  {k:'result',      t:'Résultat Final',           d:'Votre manucure terminée, rendu magazine.'}
];

/* =========================================================
   ÉTAT
   ========================================================= */
const S = {
  screen:'key', mode:null, sceneIdx:0, busy:false, error:null,
  apiKey:'',
  cfg:{prestation:PRESTATIONS[0], length:LENGTHS[1], shape:SHAPES[2], style:STYLES[0], color:COLORS[0], city:''},
  avatar:null, design:null,
  b64:{},   // base64 (data URL) par scène, pour le chaînage
  urls:{}   // blob URLs pour l'affichage / téléchargement
};

try{ S.apiKey = localStorage.getItem(KEY_STORAGE) || ''; }catch(e){}
if(S.apiKey) S.screen='landing';

/* =========================================================
   UTILS
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mimeOf = d => (d.match(/^data:(image\/[a-zA-Z+.-]+);base64,/)||[])[1] || 'image/jpeg';
const rawOf = d => d.includes(',') ? d.split(',')[1] : d;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function b64ToBlobUrl(mime, data){
  const bin = atob(data); const len = bin.length; const arr = new Uint8Array(len);
  for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr],{type:mime}));
}

// Redimensionne les photos uploadées (max 1536px) pour garder des requêtes légères
function fileToDataUrl(file, max=1536){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let {width:w,height:h} = img;
      const r = Math.min(1, max/Math.max(w,h));
      w=Math.round(w*r); h=Math.round(h*r);
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.9));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Image illisible.')); };
    img.src = url;
  });
}

function download(url, name){
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* =========================================================
   APPEL VERTEX AI (Express, clé AQ — header x-goog-api-key)
   ========================================================= */
async function callVertex(parts){
  const body = {
    contents:[{role:'user', parts}],
    generationConfig:{
      responseModalities:['TEXT','IMAGE'],
      imageConfig:{aspectRatio:ASPECT_RATIO, imageSize:IMAGE_SIZE}
    }
  };
  let lastErr;
  for(let attempt=0; attempt<=MAX_RETRIES; attempt++){
    try{
      const res = await fetch(`${VERTEX_HOST}/${MODEL_IMAGE}:generateContent`,{
        method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':S.apiKey},
        body:JSON.stringify(body)
      });
      if(res.status===429 || res.status===503){
        lastErr = new Error(res.status===429 ? 'Quota 429 : trop de demandes.' : 'Service momentanément surchargé (503).');
        if(attempt<MAX_RETRIES){
          const wait = Math.pow(2,attempt+1)*1500;
          $('#loaderNote').textContent = `Salon très fréquenté, nouvelle tentative dans ${Math.round(wait/1000)}s…`;
          await sleep(wait); continue;
        }
        throw lastErr;
      }
      const json = await res.json().catch(()=>({}));
      if(!res.ok){
        throw new Error(json?.error?.message || `Erreur Vertex AI (${res.status}).`);
      }
      return extractImage(json);
    }catch(e){
      lastErr = e;
      if(e.name==='TypeError' && attempt<MAX_RETRIES){ await sleep(2000); continue; } // réseau
      throw e;
    }
  }
  throw lastErr;
}

function extractImage(json){
  const block = json?.promptFeedback?.blockReason;
  const parts = json?.candidates?.[0]?.content?.parts || [];
  let text='';
  for(const p of parts){
    const inl = p.inlineData || p.inline_data;
    if(inl?.data) return {mime: inl.mimeType || inl.mime_type || 'image/png', data: inl.data};
    if(p.text) text = p.text;
  }
  const finish = json?.candidates?.[0]?.finishReason;
  throw new Error(text || (block?`Requête bloquée (${block}).`:'') || (finish?`Aucune image générée (${finish}).`:'') || 'Aucune image générée. Vérifiez la clarté de vos photos.');
}

/* =========================================================
   PROMPTS
   ========================================================= */
function nailSpec(){
  const c=S.cfg;
  return `technique ${c.prestation}, longueur ${c.length}, forme ${c.shape}, style ${c.style}, couleur ${c.color.name} (code hex ${c.color.hex})`;
}

MISSION : Génère une photo ultra-réaliste 9:16 d'un résultat final de manucure dans un salon professionnel.

- Sur la table : flacons de vernis de couleur ${c.color.name} (${c.color.hex}) bien visibles et alignés
- Lampe UV professionnelle sur le côté de la table

SUJET PRINCIPAL :
- Gros plan esthétique sur les mains de la cliente (issues de l'avatar fourni)
- Manucure terminée : ${nailSpec()}
- Ongles brillants, parfaitement posés
- Un flacon du vernis utilisé posé élégamment à côté des mains

RÈGLES ABSOLUES :
- Les ongles sont sur les DOIGTS, jamais sur la paume
- Photo ultra-réaliste haute définition, lumière naturelle + spot chaud, sans texte ni logo
- Rendu professionnel, comme dans un magazine beauté haut de gamme`;
}

  return `Tu es un photographe professionnel spécialisé en salons de beauté.

MISSION : Génère la SCÈNE 1 d'une séquence de manucure. Cette image sera l'ANCRE VISUELLE de toute la séquence — le salon, la table, la manucuriste et la cliente NE CHANGERONT PLUS dans les scènes suivantes.

ENVIRONNEMENT DU SALON (à fixer définitivement) :
- Salon de manucure luxueux${c.city?` situé à ${c.city}, architecture et décor inspirés de cette ville`:''}
- Table de travail en bois clair avec tapis doux, bien éclairée par lumière naturelle + spot chaud
- Sur la table : flacons de vernis de couleur ${c.color.name} (${c.color.hex}) bien visibles et alignés
- Lampe UV professionnelle posée sur le côté de la table, ÉTEINTE

PERSONNAGES (à fixer définitivement) :

- La cliente dont les mains correspondent à l'avatar fourni

ACTION DE LA SCÈNE 1 — Nettoyage & Désinfection :
- La manucuriste nettoie les mains de la cliente avec un coton et un spray désinfectant
- Les mains de la cliente sont posées à plat sur la table
- Le flacon de vernis ${c.color.name} est visible sur la table en arrière-plan

RÈGLES ABSOLUES :
- Les ongles sont sur les DOIGTS, jamais sur la paume

}

function scenePrompt(k){
  const c=S.cfg, same = `- MÊME salon, MÊME table, MÊME manucuriste, MÊME cliente qu'à la scène précédente. NE CHANGE RIEN au décor.`;
  const end = `- Photo ultra-réaliste haute définition, cadrage 9:16, sans texte`;
  const P = {
preparation:`SCÈNE 2 — Préparation des Ongles :
${same}
- Action : la manucuriste lime et prépare les ongles naturels de la cliente, travail sur les cuticules avec outils métalliques propres

application:`SCÈNE 3 — Pose du Vernis :

- Action : la manucuriste applique méticuleusement le vernis ${c.color.name} (${c.color.hex}) avec un pinceau FIN directement sur la SURFACE DES ONGLES des doigts — JAMAIS sur la paume
- Le pinceau touche l'ongle du bout du doigt, pas autre chose

lamp:`SCÈNE 4 — Séchage sous Lampe UV :

const AVATAR_NOTE_FIRST = "IMAGE AVATAR — MAINS DE LA CLIENTE : Utilise UNIQUEMENT les mains de cette personne comme base physique (morphologie, couleur de peau, taille des doigts). C'est sur CES mains que tu dois appliquer la manucure. Ignore tout autre élément de la photo.";
const AVATAR_NOTE_CHAIN = "IMAGE AVATAR — MAINS DE LA CLIENTE : Référence pour la morphologie des mains uniquement (couleur de peau, taille des doigts). Ignore tout autre élément de cette photo.";
const designNote = () => `ATTENTION — IMAGE DE RÉFÉRENCE NAIL ART UNIQUEMENT :
Cette image contient peut-être une personne. Tu dois IGNORER COMPLÈTEMENT cette personne, son visage, sa peau, son identité, son contexte.
Tu dois UNIQUEMENT extraire et reproduire : le design des ongles (motifs, couleurs, finitions, décors, style nail art).
Ce design doit être appliqué sur les mains de l'avatar fourni séparément — PAS sur les mains de cette photo d'inspiration.
Style nail art à reproduire : ${S.cfg.style}.`;

const img = d => ({inlineData:{mimeType:mimeOf(d), data:rawOf(d)}});

/* =========================================================
   GÉNÉRATION
   ========================================================= */
async function run(fn){
  if(S.busy) return;
  S.busy=true; S.error=null; $('#loader').classList.add('on');
  $('#loaderNote').textContent='Rendu 4K en cours, comptez 30 à 60 secondes.';
  try{ await fn(); }
  catch(e){ console.error(e); S.error = e.message || 'Une erreur est survenue.'; }
  S.busy=false; $('#loader').classList.remove('on');
  render();
}

function storeResult(key, r){
  S.b64[key] = `data:${r.mime};base64,${r.data}`;
  if(S.urls[key]) URL.revokeObjectURL(S.urls[key]);
  S.urls[key] = b64ToBlobUrl(r.mime, r.data);
}

async function genQuick(){
  if(!S.avatar){ S.error="Chargez d'abord une photo de vos mains."; return render(); }
  await run(async()=>{
    const parts=[img(S.avatar),{text:AVATAR_NOTE_FIRST}];
    if(S.design){ parts.push(img(S.design),{text:designNote()}); }
    parts.push({text:quickPrompt()});
    storeResult('result', await callVertex(parts));
    S.screen='final';
  });
}

async function genScene(idx){
  if(!S.avatar){ S.error="Chargez d'abord une photo de vos mains."; return render(); }
  const sc = SCENES[idx];
  const prev = idx>0 ? S.b64[SCENES[idx-1].k] : null;
  if(idx>0 && !prev){ S.error="La scène précédente n'a pas encore été générée."; return render(); }
  await run(async()=>{
    let parts;
    if(idx===0){
      parts=[img(S.avatar),{text:AVATAR_NOTE_FIRST}];
      if(S.design){ parts.push(img(S.design),{text:designNote()}); }
      parts.push({text:anchorPrompt()});
    }else{
      parts=[
        img(prev),
        {text:"Voici la scène précédente de la séquence. Tu dois ABSOLUMENT conserver : le même salon, la même table, les mêmes personnages, la même lumière. Seule l'ACTION change."},
        img(S.avatar),{text:AVATAR_NOTE_CHAIN}
      ];
      if(S.design && idx>=2){ parts.push(img(S.design),{text:designNote()}); }
      parts.push({text:scenePrompt(sc.k)});
    }
    storeResult(sc.k, await callVertex(parts));
  });
}

/* =========================================================
   VUES
   ========================================================= */
function errBlock(){
  if(!S.error) return '';
  const q = /quota|429|resource_exhausted/i.test(S.error);
  return `<div class="err ${q?'quota':''}">
    <div style="font-size:24px">${q?'⏳':'⚠️'}</div>
    <p>${q?'Nos expertes sont très demandées. Patientez une minute puis relancez.':esc(S.error)}</p>
    <button data-action="closeError">Fermer</button></div>`;
}

function vKey(){
  return `<div class="stack center">
    <div class="hero-icon gold-bg">🔑</div>
    <div><h2 class="t serif">Clé API Vertex AI</h2>
    <p class="sub">Collez votre clé (format AQ.…). Elle reste dans votre navigateur et n'est envoyée qu'à Google.</p></div>
    <input id="keyInput" class="field" type="password" autocomplete="off" placeholder="AQ.Ab8…" value="${esc(S.apiKey)}">
    <button class="btn gold-bg" data-action="saveKey">Entrer dans le studio</button>
    ${S.error?`<p style="color:#f87171;font-size:13px">${esc(S.error)}</p>`:''}
  </div>`;
}

function vLanding(){
  return `<div class="center" style="padding:40px 0">
    <div class="hero-icon gold-bg">💅</div>
    <h2 class="hero-title serif gold-text">Élégance Nails</h2>
    <p class="quote">« Une expérience de manucure virtuelle, immersive, comme si tu y étais. »</p>
    <button class="btn gold-bg cta-big" data-action="toMode">Entrer dans le salon</button>
  </div>`;
}

function vMode(){
  return `<div class="stack" style="padding-top:20px">
    <div class="center"><h2 class="t serif">Bienvenue au Studio</h2><p class="sub">Choisissez votre mode de consultation.</p></div>
    <div class="modes">
      <button class="mode" data-action="pickMode" data-mode="QUICK"><div class="ic">⚡</div><h3>Essai Rapide</h3><p>Aperçu immédiat du résultat final.</p></button>
      <button class="mode gold-bg" data-action="pickMode" data-mode="JOURNEY"><div class="ic">✨</div><h3>Parcours Salon</h3><p>Immersion complète en 6 scènes.</p></button>
    </div>
  </div>`;
}

function upBox(id,label,preview,ico){
  return `<div><label class="lbl">${label}</label>
    <div class="up ${preview?'has':''}" data-action="pick" data-id="${id}">
      ${preview?`<img src="${preview}" alt="${label}"><button class="x" data-action="clear" data-id="${id}">✕</button>`
      :`<div class="ico">${ico}</div><p>Cliquer pour charger</p><p>PNG, JPG</p>`}
      <input type="file" accept="image/*" hidden data-upload="${id}">
    </div></div>`;
}

function opts(arr,val){ return arr.map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join(''); }

function vConfig(){
  const c=S.cfg;
  return `<div class="stack">
    <div class="center"><span class="eyebrow">Configuration</span><h2 class="t serif" style="margin-top:8px">Votre Style Unique</h2></div>
    <div class="grid2">${upBox('avatar','Photo de vos mains',S.avatar,'👤')}${upBox('design','Inspiration / Modèle',S.design,'🎨')}</div>
    <div class="glass panel">
      <div><label class="lbl">📍 Ville du salon <small>(optionnel)</small></label>
        <input class="field" data-cfg="city" value="${esc(c.city)}" placeholder="ex : Paris, Tokyo, New York, Marrakech…"></div>
      <div><label class="lbl">Technique &amp; couleur</label>
        <select data-cfg="prestation">${opts(PRESTATIONS,c.prestation)}</select>
        <div class="swatches" style="margin-top:12px">${COLORS.map(x=>`<button class="sw ${x.name===c.color.name?'on':''}" title="${x.name}" data-action="color" data-name="${x.name}" style="background:${x.hex}"></button>`).join('')}</div>
        <p class="hint">Couleur sélectionnée : <span style="color:rgba(212,175,55,.85)" id="colorName">${c.color.name}</span></p></div>
      <div class="grid2">
        <div><label class="lbl">Longueur</label><select data-cfg="length">${opts(LENGTHS,c.length)}</select></div>
        <div><label class="lbl">Forme</label><select data-cfg="shape">${opts(SHAPES,c.shape)}</select></div>
      </div>
      <div><label class="lbl">Style</label><select data-cfg="style">${opts(STYLES,c.style)}</select></div>
    </div>
    <button class="btn gold-bg" id="goBtn" data-action="${S.mode==='QUICK'?'genQuick':'startJourney'}" ${S.avatar?'':'disabled'}>${S.mode==='QUICK'?'Générer la manucure':'Commencer le parcours'}</button>
    <div class="center"><button class="link" data-action="back">‹ Retour</button></div>
  </div>`;
}

function vScene(){
  const i=S.sceneIdx, sc=SCENES[i], done=!!S.urls[sc.k];
  const hasPrev = i===0 || !!S.b64[SCENES[i-1].k];
  const last = i===SCENES.length-1;
  return `<div class="stack center">
    <div><span class="eyebrow">Scène ${i+1} / ${SCENES.length}</span>
      <h2 class="t serif" style="margin-top:8px">${sc.t}</h2><p class="sub">${sc.d}</p>
      ${i>0&&!hasPrev?`<p class="warn">⚠️ Générez d'abord la scène précédente</p>`:''}
      ${i>0&&hasPrev&&!done?`<p class="ok">✓ Suite de la scène précédente — continuité garantie</p>`:''}
    </div>
    <div class="frame glass">
      ${done?`<img src="${S.urls[sc.k]}" alt="${esc(sc.t)}"><button class="dl" data-action="dl" data-k="${sc.k}" title="Télécharger">⬇</button>`
      :`<div class="ph"><span>🏛️</span><span class="eyebrow">${i===0?'Votre salon vous attend':'Scène à générer'}</span></div>`}
    </div>
    <div class="stack" style="margin-top:20px">
      ${done?`<button class="btn gold-bg" data-action="${last?'toFinal':'next'}">${last?'Voir le résultat':'Scène suivante ›'}</button>
              <button class="btn ghost" data-action="regen">Régénérer cette scène</button>`
      :`<button class="btn white" data-action="regen" ${hasPrev?'':'disabled'}>Visualiser l'intervention</button>`}
      <button class="link" data-action="prev">‹ Retour</button>
    </div>
  </div>`;
}

function vFinal(){
  const url=S.urls.result;
  const others = SCENES.filter(s=>s.k!=='result' && S.urls[s.k]);
  return `<div class="stack center">
    <h2 class="serif gold-text" style="font-size:38px">Résultat Final</h2>
    <div class="frame big">
      <img src="${url}" alt="Résultat final">
      <button class="dl" data-action="dl" data-k="result" title="Télécharger">⬇</button>
      <div class="cap"><div><p>Signature Élégance</p><p>${S.cfg.color.name}</p></div></div>
    </div>
    ${others.length?`<div><label class="lbl" style="text-align:left">Le parcours en images</label>
      <div class="gal">${others.map(s=>`<div class="th" data-action="dl" data-k="${s.k}"><img src="${S.urls[s.k]}" alt="${esc(s.t)}"></div>`).join('')}</div>
      <p class="hint" style="text-align:left">Touchez une image pour la télécharger.</p></div>`:''}
    <button class="btn ghost" data-action="reset">🗑 Nouvelle consultation</button>
  </div>`;
}

function render(){
  $('#keyBtn').style.display = S.apiKey ? 'block' : 'none';
  const v = {key:vKey, landing:vLanding, mode:vMode, config:vConfig, scene:vScene, final:vFinal}[S.screen]();
  $('#app').innerHTML = (S.screen==='key'?'':errBlock()) + v;
  window.scrollTo({top:0});
}

/* =========================================================
   ÉVÉNEMENTS
   ========================================================= */
function resetAll(){
  Object.values(S.urls).forEach(u=>URL.revokeObjectURL(u));
  S.b64={}; S.urls={}; S.avatar=null; S.design=null; S.sceneIdx=0; S.mode=null; S.error=null;
  S.screen = S.apiKey ? 'landing' : 'key';
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case 'home': if(!S.busy){ resetAll(); render(); } break;
    case 'saveKey': {
      const v = ($('#keyInput').value||'').trim();
      if(v.length<20){ S.error='Clé invalide : collez la clé complète.'; return render(); }
      S.apiKey=v; S.error=null;
      try{ localStorage.setItem(KEY_STORAGE,v); }catch(_){}
      S.screen='landing'; render(); break; }
    case 'changeKey': S.screen='key'; S.error=null; render(); break;
    case 'toMode': S.screen='mode'; render(); break;
    case 'pickMode': S.mode=el.dataset.mode; S.screen='config'; render(); break;
    case 'back': S.screen='mode'; render(); break;
    case 'pick': { if(e.target.closest('[data-action="clear"]')) return; el.querySelector('input[type=file]').click(); break; }
    case 'clear': e.stopPropagation(); S[el.dataset.id==='avatar'?'avatar':'design']=null; render(); break;
    case 'color': S.cfg.color = COLORS.find(c=>c.name===el.dataset.name);
      document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.name===S.cfg.color.name));
      $('#colorName').textContent=S.cfg.color.name; break;
    case 'genQuick': genQuick(); break;
    case 'startJourney': S.sceneIdx=0; S.screen='scene'; render(); break;
    case 'regen': genScene(S.sceneIdx); break;
    case 'next': S.sceneIdx++; render(); break;
    case 'prev': if(S.sceneIdx===0){ S.screen='config'; } else { S.sceneIdx--; } render(); break;
    case 'toFinal': S.screen='final'; render(); break;
    case 'dl': download(S.urls[el.dataset.k], `Elegance_${el.dataset.k}.png`); break;
    case 'reset': resetAll(); render(); break;
    case 'closeError': S.error=null; render(); break;
  }
});

document.addEventListener('change', async e=>{
  const up = e.target.closest('[data-upload]');
  if(up && up.files[0]){
    try{
      const d = await fileToDataUrl(up.files[0]);
      S[up.dataset.upload==='avatar'?'avatar':'design']=d;
    }catch(err){ S.error=err.message; }
    render(); return;
  }
  const cf = e.target.closest('[data-cfg]');
  if(cf) S.cfg[cf.dataset.cfg]=cf.value;
});
document.addEventListener('input', e=>{
  const cf = e.target.closest('input[data-cfg]');
  if(cf) S.cfg[cf.dataset.cfg]=cf.value;
});

render();
</script>
</body>
</html>
