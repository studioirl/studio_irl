<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio Angles</title>
<style>
:root{--bg:#0D0E11;--panel:#16181D;--panel2:#1D2027;--line:#2B2F38;--text:#ECEAE4;--muted:#8E929C;--accent:#F2B544;--accent-ink:#1A1204;--danger:#FF6B6B;--ok:#6FD3A0;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:90px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 16px;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border:2px solid var(--accent);border-radius:10px;position:relative;display:grid;place-items:center}
.logo i{width:14px;height:14px;border:2px solid var(--accent);border-radius:50%;display:block}
.logo::before,.logo::after{content:"";position:absolute;background:var(--accent)}
.logo::before{width:2px;height:8px;top:-5px;left:50%;transform:translateX(-50%)}
.logo::after{width:8px;height:2px;left:-5px;top:50%;transform:translateY(-50%)}
h1{font-size:20px;letter-spacing:.2px}
.brand p{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:8px}
.ghost{border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:14px;background:var(--panel)}
.ghost:hover{border-color:var(--accent)}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.step{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.panel h2{font-size:17px;margin-bottom:12px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

/* Keys */
.keys label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
.keys input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.keys input:focus,.libre input:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 18px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.status{font-size:13px;color:var(--muted)}

/* Dropzone */
.vf{position:relative;border:1px dashed var(--line);border-radius:12px;min-height:200px;display:grid;place-items:center;text-align:center;padding:14px;cursor:pointer;background:var(--bg);transition:border-color .2s}
.vf:hover,.vf.drag{border-color:var(--accent)}
.vf::before,.vf::after,.vf i.tr,.vf i.bl{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--accent);pointer-events:none}
.vf::before{top:8px;left:8px;border-right:0;border-bottom:0}
.vf::after{bottom:8px;right:8px;border-left:0;border-top:0}
.vf i.tr{top:8px;right:8px;border-left:0;border-bottom:0}
.vf i.bl{bottom:8px;left:8px;border-right:0;border-top:0}
.vf img{max-width:100%;max-height:420px;border-radius:8px;display:block}
.vf .ph{color:var(--muted);font-size:14px}
.vf .ph b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* Angles */
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools button{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.tools button:hover{color:var(--text);border-color:var(--accent)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;transition:border-color .15s,transform .15s}
.acard:hover{transform:translateY(-1px)}
.acard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.acard svg{width:100%;height:auto;display:block;margin-bottom:8px}
.acard b{display:block;font-size:14px}
.acard span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.d-scene{fill:#23262E;stroke:#3A3F4B;stroke-width:1.5}
.d-ref{fill:#4A4F5C}
.d-cone{fill:var(--accent);opacity:.18}
.d-cam{fill:var(--accent)}
.d-tag{fill:var(--accent);font-size:9px;font-family:ui-monospace,Menlo,monospace}
.libre{margin-top:14px}
.libre label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.libre input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}

/* Options */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 16px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--muted)}
select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* Results */
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rimg{position:relative;background:var(--panel2);display:grid;place-items:center;width:100%}
.rimg img{width:100%;height:100%;object-fit:cover;display:block}
.rimg .msg{font-size:13px;color:var(--muted);padding:12px;text-align:center}
.rimg .msg.err{color:var(--danger)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}
.rfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px}
.rfoot b{font-size:13px}
.rfoot div{display:flex;gap:6px}
.mini{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--panel)}
.mini:hover{border-color:var(--accent)}

/* Drawer / toast */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;justify-content:flex-end}
.drawer .in{width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);padding:18px;overflow:auto}
.hitem{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--bg)}
.hitem img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.hitem .t{flex:1;font-size:13px;cursor:pointer}
.hitem .t small{display:block;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:92%;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo"><i></i></div>
    <div><h1>Studio Angles</h1><p>Un lieu, tous les points de vue</p></div>
  </div>
  <div class="actions">
    <button class="ghost" id="btnHist">Historique</button>
    <button class="ghost" id="btnKeys" aria-label="Clés API">⚙</button>
  </div>
</header>

<main class="wrap">

  <section class="panel keys hidden" id="keysPanel">
    <h2>Clés API</h2>
    <label for="keyVertex">Vertex AI (clé AQ…)</label>
    <input type="password" id="keyVertex" placeholder="Colle ta clé Vertex" autocomplete="off">
    <label for="keyKie">kie.ai</label>
    <input type="password" id="keyKie" placeholder="Colle ta clé kie.ai" autocomplete="off">
    <div class="row">
      <button class="btn" id="keysSave">Enregistrer</button>
      <button class="btn sec" id="keysClear">Effacer</button>
      <span class="status" id="keysStatus"></span>
    </div>
  </section>

  <section class="panel">
    <div class="step">01 · Référence</div>
    <h2>Image du lieu</h2>
    <div class="vf" id="drop">
      <i class="tr"></i><i class="bl"></i>
      <div class="ph" id="dropPh"><b>Dépose ta photo ici</b>ou touche pour en choisir une</div>
      <img id="refImg" class="hidden" alt="Référence">
    </div>
    <input type="file" id="file" accept="image/*" class="hidden">
    <div class="row hidden" id="refRow"><button class="btn sec" id="refChange">Changer d’image</button></div>
  </section>

  <section class="panel">
    <div class="step">02 · Angles</div>
    <h2>Points de vue à générer</h2>
    <div class="tools">
      <button id="selAll">Tout sélectionner</button>
      <button id="selNone">Aucun</button>
      <span class="status" id="selCount" style="align-self:center"></span>
    </div>
    <div class="agrid" id="agrid"></div>
    <div class="libre">
      <label for="libre">Angle libre (optionnel) : dis où se place la caméra et vers quoi elle regarde</label>
      <input type="text" id="libre" placeholder="ex. depuis l’arche, face aux invités">
    </div>
  </section>

  <section class="panel">
    <div class="step">03 · Génération</div>
    <h2>Moteur et format</h2>
    <div class="row" style="margin-top:0;align-items:flex-end">
      <div class="field"><span>Moteur</span>
        <div class="seg" id="seg"><button data-engine="vertex">Vertex AI</button><button data-engine="kie">kie.ai</button></div>
      </div>
      <div class="field"><span>Format de sortie</span>
        <select id="ratio">
          <option value="auto">Identique à la référence</option>
          <option value="9:16">9:16</option>
          <option value="4:5">4:5</option>
          <option value="3:4">3:4</option>
          <option value="1:1">1:1</option>
          <option value="4:3">4:3</option>
          <option value="16:9">16:9</option>
        </select>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="go">Générer les angles</button>
      <button class="btn sec hidden" id="stop">Arrêter</button>
      <span class="status" id="runStatus"></span>
    </div>
  </section>

  <section class="panel hidden" id="results">
    <div class="rhead">
      <h2 style="margin:0">Résultats</h2>
      <button class="btn sec hidden" id="zip">Tout télécharger (ZIP)</button>
    </div>
    <div class="rgrid" id="rgrid"></div>
  </section>

</main>

<div class="drawer hidden" id="drawer">
  <div class="in">
    <div class="rhead"><h2 style="margin:0">Historique</h2><button class="ghost" id="drawerClose">Fermer</button></div>
    <div id="hlist"></div>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- Constantes ---------- */
var MODEL_IMAGE='gemini-3.1-flash-image';
var MODEL_TEXT='gemini-2.5-flash';
var K_VERTEX='sa_vertex_key', K_KIE='sa_kie_key', K_ENGINE='sa_engine';

var ANGLES=[
  {id:'contre',name:'Contre-champ',short:'De l’autre côté, face à la photo',cx:50,cy:12,rot:180,
   text:'La caméra est placée à l’autre bout de la scène, à l’endroit visible au fond de l’image de référence, et regarde en direction de l’endroit d’où la photo de référence a été prise (contre-champ, demi-tour complet). On voit ce qui se trouvait derrière le photographe sur l’image de référence. Tout ce qui était tourné vers le fond de l’image de référence (chaises, assises, sièges) est maintenant tourné vers la caméra : les chaises sont vues de face, on voit les assises et l’avant des chaises, jamais leurs dossiers de dos. Si des personnes sont assises, elles font face à la caméra.'},
  {id:'large',name:'Plan large reculé',short:'Même axe, la caméra recule',cx:50,cy:96,rot:0,
   text:'Même direction que l’image de référence, mais la caméra recule nettement pour montrer le lieu en entier, en plan très large.'},
  {id:'g34',name:'3/4 gauche',short:'En diagonale depuis la gauche',cx:16,cy:80,rot:40,
   text:'La caméra est décalée sur la gauche et regarde le lieu en diagonale (vue en trois quarts depuis la gauche).'},
  {id:'d34',name:'3/4 droite',short:'En diagonale depuis la droite',cx:84,cy:80,rot:-40,
   text:'La caméra est décalée sur la droite et regarde le lieu en diagonale (vue en trois quarts depuis la droite).'},
  {id:'pg',name:'Profil gauche',short:'Sur le côté gauche, de profil',cx:10,cy:43,rot:90,
   text:'La caméra est placée sur le côté gauche, perpendiculaire à l’axe de l’image de référence, et regarde le lieu de profil.'},
  {id:'pd',name:'Profil droit',short:'Sur le côté droit, de profil',cx:90,cy:43,rot:-90,
   text:'La caméra est placée sur le côté droit, perpendiculaire à l’axe de l’image de référence, et regarde le lieu de profil.'},
  {id:'plong',name:'Plongée',short:'En hauteur, penchée vers le bas',cx:50,cy:82,rot:0,tag:'HAUT',
   text:'Vue en plongée : la caméra est placée en hauteur, inclinée vers le bas, et surplombe le lieu.'},
  {id:'aerien',name:'Vue aérienne',short:'Depuis le ciel, type drone',cx:50,cy:43,rot:0,tag:'DRONE',center:true,
   text:'Vue aérienne type drone : la caméra est très haut au-dessus du lieu et regarde droit vers le sol.'},
  {id:'contrep',name:'Contre-plongée',short:'Au ras du sol, vers le haut',cx:50,cy:84,rot:0,tag:'SOL',
   text:'Contre-plongée : la caméra est placée très bas, au ras du sol, et regarde vers le haut.'},
  {id:'detail',name:'Gros plan détail',short:'Tout près d’un élément marquant',cx:50,cy:64,rot:0,
   text:'Gros plan sur un détail marquant du lieu visible sur l’image de référence, caméra très proche, arrière-plan flou.'},
  {id:'chaises',name:'Chaises de face',short:'Deux chaises côte à côte, vues de face',cx:50,cy:36,rot:180,
   text:'Gros plan de deux chaises côte à côte, prises dans une même rangée du lieu visible sur l’image de référence, vues de face : la caméra est placée devant les chaises, à hauteur des assises, et regarde dans leur direction. Les chaises sont tournées vers la caméra : on voit les assises et l’avant des chaises, jamais leurs dossiers de dos. Arrière-plan flou.'},
  {id:'rangeeg',name:'Rangée gauche de face',short:'La rangée de gauche, chaises face caméra',cx:34,cy:12,rot:200,
   text:'La caméra est placée à l’arche, à l’endroit visible au fond de l’image de référence, et regarde en direction de la rangée de chaises située à gauche sur l’image de référence, dans l’axe de cette rangée, vers l’endroit d’où la photo de référence a été prise. Les chaises de cette rangée sont tournées vers la caméra : on les voit de face, avec les assises et l’avant des chaises alignées l’une derrière l’autre, jamais leurs dossiers de dos. Si des personnes sont assises, elles font face à la caméra.'},
  {id:'rangeed',name:'Rangée droite de face',short:'La rangée de droite, chaises face caméra',cx:66,cy:12,rot:160,
   text:'La caméra est placée à l’arche, à l’endroit visible au fond de l’image de référence, et regarde en direction de la rangée de chaises située à droite sur l’image de référence, dans l’axe de cette rangée, vers l’endroit d’où la photo de référence a été prise. Les chaises de cette rangée sont tournées vers la caméra : on les voit de face, avec les assises et l’avant des chaises alignées l’une derrière l’autre, jamais leurs dossiers de dos. Si des personnes sont assises, elles font face à la caméra.'}
];
var DEFAULT_SEL=['contre','g34','d34','plong','detail','large'];

var RATIOS=[['1:1',1],['2:3',2/3],['3:2',1.5],['3:4',0.75],['4:3',4/3],['4:5',0.8],['5:4',1.25],['9:16',9/16],['16:9',16/9],['21:9',21/9]];

/* ---------- Utilitaires ---------- */
function $(s){return document.querySelector(s);}
function safeLocalGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeLocalSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function safeLocalRemove(k){try{localStorage.removeItem(k);}catch(e){}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'angle';}
function ext(m){return /png/.test(m||'')?'png':'jpg';}
function b64ToBlob(b64,mime){var bin=atob(b64),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime});}
function nearestRatio(w,h){var r=w/h,best=RATIOS[0],d=1e9;RATIOS.forEach(function(x){var dd=Math.abs(Math.log(r/x[1]));if(dd<d){d=dd;best=x;}});return best[0];}
function triggerDownload(blob,name){var a=document.createElement('a');var u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},4000);}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},3200);}

function withRetry(fn,tries){
  tries=tries||4;
  var delay=4000;
  return (function loop(i){
    return fn().catch(function(e){
      if(!e.retry||i>=tries-1)throw e;
      var d=delay;delay*=2;
      return sleep(d).then(function(){return loop(i+1);});
    });
  })(0);
}

/* ---------- État ---------- */
var state={
  ref:null,
  selected:new Set(DEFAULT_SEL),
  engine:safeLocalGet(K_ENGINE)==='kie'?'kie':'vertex',
  running:false,abort:false,
  items:[],cssRatio:'3/4',ctx:null
};

/* ---------- Clés API ---------- */
function refreshKeyStatus(){
  var v=safeLocalGet(K_VERTEX),k=safeLocalGet(K_KIE);
  $('#keysStatus').textContent='Vertex : '+(v?'enregistrée ✓':'absente')+' · kie.ai : '+(k?'enregistrée ✓':'absente');
}
$('#btnKeys').addEventListener('click',function(){$('#keysPanel').classList.toggle('hidden');refreshKeyStatus();});
function openSettings(){$('#keysPanel').classList.remove('hidden');refreshKeyStatus();window.scrollTo({top:0,behavior:'smooth'});}
$('#keysSave').addEventListener('click',function(){
  var v=$('#keyVertex').value.trim(),k=$('#keyKie').value.trim();
  if(v)safeLocalSet(K_VERTEX,v);
  if(k)safeLocalSet(K_KIE,k);
  $('#keyVertex').value='';$('#keyKie').value='';
  refreshKeyStatus();toast('Clés enregistrées.');
});
$('#keysClear').addEventListener('click',function(){
  safeLocalRemove(K_VERTEX);safeLocalRemove(K_KIE);
  refreshKeyStatus();toast('Clés effacées.');
});
refreshKeyStatus();

/* ---------- Référence ---------- */
function loadRef(file){
  if(!file)return;
  var url=URL.createObjectURL(file);
  var img=new Image();
  img.onload=function(){
    var max=2048,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    var w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
    var c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    var dataUrl=c.toDataURL('image/jpeg',0.92);
    // miniature pour l’historique
    var ts=Math.min(1,320/Math.max(w,h)),tc=document.createElement('canvas');
    tc.width=Math.round(w*ts);tc.height=Math.round(h*ts);
    tc.getContext('2d').drawImage(img,0,0,tc.width,tc.height);
    state.ref={dataUrl:dataUrl,b64:dataUrl.split(',')[1],mime:'image/jpeg',w:w,h:h,thumb:tc.toDataURL('image/jpeg',0.7)};
    URL.revokeObjectURL(url);
    $('#refImg').src=dataUrl;$('#refImg').classList.remove('hidden');
    $('#dropPh').classList.add('hidden');$('#refRow').classList.remove('hidden');
  };
  img.onerror=function(){URL.revokeObjectURL(url);toast('Image illisible, essaie un autre fichier.');};
  img.src=url;
}
var drop=$('#drop'),fileIn=$('#file');
drop.addEventListener('click',function(){fileIn.click();});
$('#refChange').addEventListener('click',function(){fileIn.click();});
fileIn.addEventListener('change',function(){loadRef(fileIn.files[0]);fileIn.value='';});
['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('drag');});});
['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('drag');});});
drop.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadRef(f);});

/* ---------- Angles ---------- */
function diagram(a){
  var cone='<polygon class="d-cone" points="0,0 -13,-26 13,-26"/>';
  var body=a.center?'<circle class="d-cam" r="5"/>':'<polygon class="d-cam" points="0,-5 -5,4 5,4"/>';
  var tag=a.tag?'<text class="d-tag" x="6" y="12">'+a.tag+'</text>':'';
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
    '<rect class="d-scene" x="30" y="28" width="40" height="30" rx="3"/>'+
    '<circle class="d-ref" cx="50" cy="91" r="3"/>'+
    '<g transform="translate('+a.cx+' '+a.cy+') rotate('+a.rot+')">'+(a.center?'':cone)+body+'</g>'+tag+
    '</svg>';
}
function renderAngles(){
  var g=$('#agrid');g.innerHTML='';
  ANGLES.forEach(function(a){
    var b=document.createElement('button');
    b.type='button';b.className='acard'+(state.selected.has(a.id)?' on':'');
    b.innerHTML=diagram(a)+'<b>'+a.name+'</b><span>'+a.short+'</span>';
    b.addEventListener('click',function(){
      if(state.selected.has(a.id))state.selected.delete(a.id);else state.selected.add(a.id);
      renderAngles();
    });
    g.appendChild(b);
  });
  var n=state.selected.size+($('#libre').value.trim()?1:0);
  $('#selCount').textContent=n+' angle'+(n>1?'s':'')+' sélectionné'+(n>1?'s':'');
}
$('#selAll').addEventListener('click',function(){ANGLES.forEach(function(a){state.selected.add(a.id);});renderAngles();});
$('#selNone').addEventListener('click',function(){state.selected.clear();renderAngles();});
$('#libre').addEventListener('input',renderAngles);
function getSelectedAngles(){
  var list=ANGLES.filter(function(a){return state.selected.has(a.id);});
  var l=$('#libre').value.trim();
  if(l)list.push({id:'libre',name:'Angle libre',text:l.charAt(0).toUpperCase()+l.slice(1)+(/[.!?]$/.test(l)?'':'.')});
  return list;
}
renderAngles();

/* ---------- Moteur ---------- */
function renderSeg(){
  document.querySelectorAll('#seg button').forEach(function(b){b.classList.toggle('on',b.dataset.engine===state.engine);});
}
document.querySelectorAll('#seg button').forEach(function(b){
  b.addEventListener('click',function(){state.engine=b.dataset.engine;safeLocalSet(K_ENGINE,state.engine);renderSeg();});
});
renderSeg();

function getRatio(){
  var v=$('#ratio').value;
  if(v!=='auto')return v;
  return state.ref?nearestRatio(state.ref.w,state.ref.h):'3:4';
}

/* ---------- Prompt ---------- */
function buildPrompt(angle,fiche){
  var lieu=fiche?'\n\nLe lieu, tel qu’il apparaît sur l’image de référence : '+fiche:'';
  return 'Photographie ultra-réaliste du même lieu que sur l’image de référence, prise depuis un autre point de vue.'+lieu+
    '\n\nPoint de vue : '+angle.text+
    '\n\nLe lieu reste strictement identique : mêmes éléments, mêmes matériaux, mêmes couleurs, même lumière, même heure, même météo, même ambiance. Les parties du lieu qui ne sont pas visibles sur l’image de référence se prolongent de façon cohérente avec son style. Rien n’est ajouté, retiré ni déplacé, sauf ce que le nouveau point de vue fait naturellement apparaître ou disparaître. Rendu photographique réaliste, textures naturelles, qualité 4K.';
}

/* ---------- Vertex AI ---------- */
function vertexCall(model,parts,genConfig,key){
  var url='https://aiplatform.googleapis.com/v1/publishers/google/models/'+model+':generateContent';
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({contents:[{role:'user',parts:parts}],generationConfig:genConfig})
  }).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){
        var e=new Error('Vertex '+r.status+' : '+t.slice(0,300));
        e.retry=(r.status===429||r.status===503);throw e;
      });
    }
    return r.json();
  });
}
function analyseLieu(key){
  var p='Décris uniquement ce qui est visible sur cette image : le lieu, le décor, les matériaux, les couleurs, les éléments et leur disposition, la lumière, le moment de la journée, la météo, l’ambiance. Si des personnes sont présentes, indique seulement leur présence, leur nombre et leurs actions, sans décrire leur apparence physique ni leurs vêtements. N’invente rien. Réponds en un seul paragraphe en français, sans titre ni liste.';
  return withRetry(function(){
    return vertexCall(MODEL_TEXT,[{text:p},{inlineData:{mimeType:state.ref.mime,data:state.ref.b64}}],{},key);
  }).then(function(j){
    var ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    return ps.map(function(x){return x.text||'';}).join(' ').trim();
  });
}
function vertexImage(prompt,ratio,key){
  return withRetry(function(){
    return vertexCall(MODEL_IMAGE,[{text:prompt},{inlineData:{mimeType:state.ref.mime,data:state.ref.b64}}],
      {responseModalities:['TEXT','IMAGE'],imageConfig:{aspectRatio:ratio,imageSize:'4K'}},key);
  }).then(function(j){
    var cand=j.candidates&&j.candidates[0];
    var ps=(cand&&cand.content&&cand.content.parts)||[];
    var img=ps.filter(function(p){return p.inlineData&&p.inlineData.data;})[0];
    if(!img)throw new Error('Aucune image renvoyée'+(cand&&cand.finishReason?' ('+cand.finishReason+')':'')+'.');
    var mime=img.inlineData.mimeType||'image/png';
    return {blob:b64ToBlob(img.inlineData.data,mime),mime:mime};
  });
}

/* ---------- kie.ai ---------- */
function kieUpload(key){
  return fetch('https://kieai.redpandaai.co/api/file-base64-upload',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({base64Data:'data:'+state.ref.mime+';base64,'+state.ref.b64,uploadPath:'studio-angles',fileName:'ref-'+Date.now()+'.jpg'})
  }).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(o){
    if(!o.r.ok||(o.j.code&&o.j.code!==200))throw new Error('kie.ai upload : '+(o.j.msg||o.r.status));
    var u=o.j.data&&(o.j.data.downloadUrl||o.j.data.fileUrl);
    if(!u)throw new Error('kie.ai upload : URL manquante.');
    return u;
  });
}
function kieImage(prompt,ratio,key,refUrl){
  return withRetry(function(){
    return fetch('https://api.kie.ai/api/v1/jobs/createTask',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:'nano-banana-2',input:{prompt:prompt,image_input:[refUrl],aspect_ratio:ratio,resolution:'4K',output_format:'png'}})
    }).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(o){
      if(o.r.status===429||o.j.code===429){var e=new Error('kie.ai : trop de requêtes.');e.retry=true;throw e;}
      if(!o.r.ok||o.j.code!==200)throw new Error('kie.ai : '+(o.j.msg||o.r.status));
      return o.j.data.taskId;
    });
  }).then(function(taskId){
    var started=Date.now();
    return (function poll(){
      if(state.abort)throw new Error('Annulé.');
      if(Date.now()-started>6*60*1000)throw new Error('kie.ai : délai dépassé.');
      return sleep(4000).then(function(){
        return fetch('https://api.kie.ai/api/v1/jobs/recordInfo?taskId='+encodeURIComponent(taskId),{headers:{'Authorization':'Bearer '+key}});
      }).then(function(r){return r.json();}).then(function(j){
        if(j.code!==200)throw new Error('kie.ai : '+(j.msg||'erreur de suivi'));
        var st=j.data&&j.data.state;
        if(st==='success'){
          var res=JSON.parse(j.data.resultJson||'{}');
          var u=res.resultUrls&&res.resultUrls[0];
          if(!u)throw new Error('kie.ai : aucune image renvoyée.');
          return u;
        }
        if(st==='fail')throw new Error('kie.ai : '+(j.data.failMsg||'génération échouée')+'.');
        return poll();
      });
    })();
  }).then(function(u){
    return fetch(u).then(function(r){if(!r.ok)throw new Error('dl');return r.blob();}).then(function(b){
      return {blob:b,mime:b.type||'image/png'};
    }).catch(function(){return {url:u,mime:'image/png'};});
  });
}

/* ---------- Résultats ---------- */
function renderResults(){
  $('#results').classList.remove('hidden');
  var g=$('#rgrid');g.innerHTML='';
  state.items.forEach(function(it,idx){
    var card=document.createElement('div');card.className='rcard';
    var fig=document.createElement('div');fig.className='rimg';fig.style.aspectRatio=state.cssRatio;
    var src=it.blob?(it.objUrl||(it.objUrl=URL.createObjectURL(it.blob))):it.url;
    if(it.status==='ok'&&src){var im=document.createElement('img');im.src=src;im.alt=it.label;fig.appendChild(im);}
    else if(it.status==='run'){fig.innerHTML='<div class="msg"><div class="spin"></div>Génération…</div>';}
    else if(it.status==='err'){var m=document.createElement('div');m.className='msg err';m.textContent=it.error||'Erreur.';fig.appendChild(m);}
    else if(it.status==='cancel'){fig.innerHTML='<div class="msg">Annulé</div>';}
    else{fig.innerHTML='<div class="msg">En attente</div>';}
    var foot=document.createElement('div');foot.className='rfoot';
    var t=document.createElement('b');t.textContent=it.label;foot.appendChild(t);
    var btns=document.createElement('div');
    if(it.status==='ok'){
      var dl=document.createElement('button');dl.className='mini';dl.textContent='Télécharger';
      dl.addEventListener('click',function(){
        if(it.blob)triggerDownload(it.blob,String(idx+1).padStart(2,'0')+'-'+slug(it.label)+'.'+ext(it.mime));
        else window.open(it.url,'_blank');
      });
      btns.appendChild(dl);
    }
    if((it.status==='ok'||it.status==='err'||it.status==='cancel')&&state.ctx&&!state.running&&it.text){
      var rg=document.createElement('button');rg.className='mini';rg.textContent=it.status==='ok'?'Refaire':'Réessayer';
      rg.addEventListener('click',function(){retryItem(it);});
      btns.appendChild(rg);
    }
    foot.appendChild(btns);
    card.appendChild(fig);card.appendChild(foot);g.appendChild(card);
  });
  var hasOk=state.items.some(function(i){return i.blob;});
  $('#zip').classList.toggle('hidden',!hasOk);
}

function generateItem(it){
  var c=state.ctx;
  it.status='run';it.error='';renderResults();
  var prompt=buildPrompt({text:it.text},c.fiche);
  var p;
  if(c.engine==='vertex'){p=vertexImage(prompt,c.ratio,c.key);}
  else{
    var ensure=c.kieRefUrl?Promise.resolve(c.kieRefUrl):kieUpload(c.key).then(function(u){c.kieRefUrl=u;return u;});
    p=ensure.then(function(u){return kieImage(prompt,c.ratio,c.key,u);});
  }
  return p.then(function(res){
    if(it.objUrl){URL.revokeObjectURL(it.objUrl);it.objUrl=null;}
    it.blob=res.blob||null;it.url=res.url||null;it.mime=res.mime;it.status='ok';
  }).catch(function(e){
    it.status='err';it.error=(e&&e.message)||'Erreur inconnue.';
  }).then(function(){renderResults();});
}

function retryItem(it){
  if(state.running)return;
  state.running=true;state.abort=false;setRunningUI(true);
  generateItem(it).then(function(){state.running=false;setRunningUI(false);$('#runStatus').textContent='';saveRun();});
}

function setRunningUI(on){
  $('#go').disabled=on;
  $('#stop').classList.toggle('hidden',!on);
}

function generate(){
  if(state.running)return;
  if(!state.ref){toast('Ajoute d’abord une image de référence.');return;}
  var angles=getSelectedAngles();
  if(!angles.length){toast('Choisis au moins un angle.');return;}
  var vKey=(safeLocalGet(K_VERTEX)||'').trim(),kKey=(safeLocalGet(K_KIE)||'').trim();
  var key=state.engine==='vertex'?vKey:kKey;
  if(!key){openSettings();toast('Ajoute ta clé '+(state.engine==='vertex'?'Vertex AI':'kie.ai')+' dans ⚙.');return;}
  var ratio=getRatio();
  state.cssRatio=ratio.replace(':','/');
  state.running=true;state.abort=false;setRunningUI(true);
  state.items.forEach(function(i){if(i.objUrl)URL.revokeObjectURL(i.objUrl);});
  state.items=angles.map(function(a){return {id:a.id,label:a.name,text:a.text,status:'wait'};});
  state.ctx={engine:state.engine,key:key,ratio:ratio,fiche:'',kieRefUrl:null};
  renderResults();
  $('#results').scrollIntoView({behavior:'smooth',block:'start'});

  var chain=Promise.resolve();
  if(vKey){
    $('#runStatus').textContent='Analyse du lieu…';
    chain=analyseLieu(vKey).then(function(f){state.ctx.fiche=f;}).catch(function(e){console.warn('Analyse du lieu impossible',e);});
  }
  state.items.forEach(function(it,i){
    chain=chain.then(function(){
      if(state.abort){it.status='cancel';renderResults();return;}
      $('#runStatus').textContent='Angle '+(i+1)+'/'+state.items.length+' · '+it.label;
      return generateItem(it);
    });
  });
  chain.then(function(){
    state.running=false;setRunningUI(false);
    var ok=state.items.filter(function(i){return i.status==='ok';}).length;
    $('#runStatus').textContent=ok+'/'+state.items.length+' angle'+(state.items.length>1?'s':'')+' généré'+(ok>1?'s':'');
    renderResults();saveRun();
  });
}
$('#go').addEventListener('click',generate);
$('#stop').addEventListener('click',function(){state.abort=true;$('#runStatus').textContent='Arrêt en cours…';});

/* ---------- ZIP ---------- */
$('#zip').addEventListener('click',function(){
  var ok=state.items.filter(function(i){return i.blob;});
  if(!ok.length)return;
  if(typeof JSZip==='undefined'){toast('ZIP indisponible (connexion requise).');return;}
  var z=new JSZip();
  ok.forEach(function(it,i){z.file(String(i+1).padStart(2,'0')+'-'+slug(it.label)+'.'+ext(it.mime),it.blob);});
  z.generateAsync({type:'blob'}).then(function(b){triggerDownload(b,'studio-angles.zip');});
});

/* ---------- Historique (IndexedDB) ---------- */
var DB_NAME='studio_angles',STORE='runs';
function openDB(){return new Promise(function(res,rej){
  var r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=function(){r.result.createObjectStore(STORE,{keyPath:'id'});};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
});}
function dbTx(mode,fn){return openDB().then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction(STORE,mode),out=fn(tx.objectStore(STORE));
  tx.oncomplete=function(){res(out&&out.result);};tx.onerror=function(){rej(tx.error);};
});});}
function saveRun(){
  var ok=state.items.filter(function(i){return i.blob;});
  if(!ok.length)return Promise.resolve();
  return Promise.all(ok.map(function(i){return i.blob.arrayBuffer().then(function(buf){return {label:i.label,mime:i.mime,buf:buf};});}))
  .then(function(items){
    var rec={id:Date.now(),thumb:state.ref&&state.ref.thumb,ratio:state.cssRatio,items:items};
    return dbTx('readwrite',function(s){s.put(rec);});
  }).then(function(){return dbTx('readonly',function(s){return s.getAllKeys();});})
  .then(function(keys){
    keys=(keys||[]).sort(function(a,b){return b-a;});
    var old=keys.slice(12);
    if(old.length)return dbTx('readwrite',function(s){old.forEach(function(k){s.delete(k);});});
  }).catch(function(e){console.warn('Historique non enregistré',e);});
}
function openHistory(){
  $('#drawer').classList.remove('hidden');
  var box=$('#hlist');box.innerHTML='<p class="hint">Chargement…</p>';
  dbTx('readonly',function(s){return s.getAll();}).then(function(list){
    list=(list||[]).sort(function(a,b){return b.id-a.id;});
    box.innerHTML='';
    if(!list.length){box.innerHTML='<p class="hint">Aucune génération enregistrée pour l’instant.</p>';return;}
    list.forEach(function(rec){
      var row=document.createElement('div');row.className='hitem';
      var im=document.createElement('img');im.src=rec.thumb||'';im.alt='';
      var t=document.createElement('div');t.className='t';
      t.innerHTML=new Date(rec.id).toLocaleString('fr-FR')+'<small>'+rec.items.length+' angle'+(rec.items.length>1?'s':'')+'</small>';
      var del=document.createElement('button');del.className='mini';del.textContent='Suppr.';
      function load(){
        state.items.forEach(function(i){if(i.objUrl)URL.revokeObjectURL(i.objUrl);});
        state.cssRatio=rec.ratio||'3/4';
        state.items=rec.items.map(function(x){return {label:x.label,mime:x.mime,blob:new Blob([x.buf],{type:x.mime}),status:'ok'};});
        renderResults();$('#drawer').classList.add('hidden');
        $('#results').scrollIntoView({behavior:'smooth',block:'start'});
      }
      t.addEventListener('click',load);im.addEventListener('click',load);
      del.addEventListener('click',function(){dbTx('readwrite',function(s){s.delete(rec.id);}).then(function(){row.remove();});});
      row.appendChild(im);row.appendChild(t);row.appendChild(del);box.appendChild(row);
    });
  }).catch(function(){box.innerHTML='<p class="hint">Historique indisponible sur ce navigateur.</p>';});
}
$('#btnHist').addEventListener('click',openHistory);
$('#drawerClose').addEventListener('click',function(){$('#drawer').classList.add('hidden');});
$('#drawer').addEventListener('click',function(e){if(e.target===$('#drawer'))$('#drawer').classList.add('hidden');});

})();
</script>
