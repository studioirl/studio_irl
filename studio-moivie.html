<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Movie</title>
<style>
:root{--bg:#14090f;--card:#201019;--card2:#2a1622;--line:#43232f;--rose:#e8738f;--rose2:#ff9db3;--txt:#f6e9ed;--mut:#b99aa5;--ok:#7fd9a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:26px;margin:6px 0 2px}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 5px}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rose)}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tab{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;text-align:center;font-size:14px}
.tab.on{background:var(--rose);color:#2a0f19;border-color:var(--rose);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.person{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.person h3{margin:0 0 4px;font-size:16px;color:var(--rose2)}
.drop{display:flex;align-items:center;justify-content:center;height:150px;border:1px dashed var(--line);border-radius:10px;cursor:pointer;color:var(--mut);font-size:14px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.drop.has{color:transparent}
.drop input{display:none}
.rm{position:absolute;top:6px;right:6px;background:#000a;color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer;display:none}
.drop.has .rm{display:block}
.btn{background:var(--rose);color:#2a0f19;border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn:disabled{opacity:.5;cursor:wait}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--rose2);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:end}
.row>*{flex:1}
.err{background:#3a1218;border:1px solid #7a2030;color:#ffb3bf;padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px;display:none;white-space:pre-wrap}
.idea h3{margin:0 0 4px;font-size:18px}
.tag{display:inline-block;font-size:12px;background:var(--card2);border:1px solid var(--line);color:var(--rose2);padding:2px 9px;border-radius:20px;margin-bottom:8px}
.k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:9px}
.hook{background:var(--card2);border-left:3px solid var(--rose);padding:8px 10px;border-radius:6px;margin-top:8px;font-style:italic}
.scene{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:8px}
.scene b{color:var(--rose2)}
.dev{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #2a0f19;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Studio Movie</h1>
  <p class="sub">Des histoires de couple banales, vraies, qui donnent envie de suivre leur quotidien.</p>

  <div class="card">
    <label style="margin-top:0">Clé API Vertex (AQ…)</label>
    <input id="key" type="password" placeholder="AQ.xxxxxxxx" autocomplete="off">
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab on" data-m="texte">Je décris les personnalités</div>
      <div class="tab" data-m="photo">Je pars des photos</div>
    </div>
    <div class="grid" style="margin-top:10px">
      <div class="person">
        <h3>Lui</h3>
        <label>Prénom</label>
        <input id="n1" placeholder="Prénom">
        <div class="photoBox" style="display:none">
          <label>Photo</label>
          <div class="drop" id="d1">Ajouter une photo<input type="file" accept="image/*"><button class="rm" type="button">×</button></div>
        </div>
        <label>Personnalité</label>
        <textarea id="p1" placeholder="Ex : calme, un peu têtu, très pudique, montre son amour par des gestes, déteste les surprises…"></textarea>
      </div>
      <div class="person">
        <h3>Elle</h3>
        <label>Prénom</label>
        <input id="n2" placeholder="Prénom">
        <div class="photoBox" style="display:none">
          <label>Photo</label>
          <div class="drop" id="d2">Ajouter une photo<input type="file" accept="image/*"><button class="rm" type="button">×</button></div>
        </div>
        <label>Personnalité</label>
        <textarea id="p2" placeholder="Ex : spontanée, organisée, dit tout ce qu'elle pense, s'endort partout…"></textarea>
      </div>
    </div>
    <div class="grid">
      <div>
        <label>Contexte du couple (facultatif)</label>
        <input id="ctx" placeholder="Ex : ensemble depuis 5 ans, parents d'un bébé, pas encore mariés…">
      </div>
      <div>
        <label>Nombre d'idées</label>
        <select id="nb"><option>5</option><option>6</option><option>7</option></select>
      </div>
    </div>
    <div class="hint" id="modeHint">Décris chacun avec tes mots : plus c'est précis, plus les histoires sonnent vraies.</div>
    <div class="err" id="err"></div>
    <div style="margin-top:14px"><button class="btn" id="go">Trouver des idées d'histoires</button></div>
  </div>

  <div id="out"></div>
</div>

<script>
const MODEL_TEXT = 'gemini-2.5-flash';
const ENDPOINT = 'https://aiplatform.googleapis.com/v1/publishers/google/models/' + MODEL_TEXT + ':generateContent';
const $ = s => document.querySelector(s);
let mode = 'texte';
const photos = {1:null, 2:null};
let lastIdeas = [];

try { const k = localStorage.getItem('sc_key'); if (k) $('#key').value = k; } catch(e){}
$('#key').addEventListener('change', () => { try { localStorage.setItem('sc_key', $('#key').value.trim()); } catch(e){} });

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  mode = t.dataset.m;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.photoBox').forEach(b => b.style.display = mode === 'photo' ? 'block' : 'none');
  $('#modeHint').textContent = mode === 'photo'
    ? "Ajoute une photo de lui et/ou d'elle : seules l'ambiance, l'attitude et le contexte visibles servent de base. La personnalité reste facultative."
    : "Décris chacun avec tes mots : plus c'est précis, plus les histoires sonnent vraies.";
}));

function resizeToB64(file, max = 1024) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.85);
        res({ url, b64: url.split(',')[1] });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

[1,2].forEach(i => {
  const d = $('#d'+i), inp = d.querySelector('input[type=file]'), rm = d.querySelector('.rm');
  inp.addEventListener('change', async () => {
    if (!inp.files[0]) return;
    try {
      const p = await resizeToB64(inp.files[0]);
      photos[i] = p;
      d.style.backgroundImage = 'url(' + p.url + ')';
      d.classList.add('has');
    } catch(e){ showErr("Image illisible."); }
  });
  rm.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    photos[i] = null; inp.value = '';
    d.style.backgroundImage = ''; d.classList.remove('has');
  });
});

function showErr(m){ const e = $('#err'); e.textContent = m; e.style.display = m ? 'block' : 'none'; }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function gemini(parts, system) {
  const key = $('#key').value.trim();
  if (!key) throw new Error('Ajoute ta clé API Vertex.');
  const body = {
    systemInstruction: { parts: [{ text: system }] },
    contents: [{ role: 'user', parts }],
    generationConfig: { responseMimeType: 'application/json', temperature: 1 }
  };
  let wait = 2000;
  for (let a = 0; a < 5; a++) {
    const r = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(body)
    });
    if (r.status === 429 && a < 4) { await sleep(wait); wait *= 2; continue; }
    if (!r.ok) {
      let t = ''; try { t = await r.text(); } catch(e){}
      throw new Error('Erreur ' + r.status + ' : ' + t.slice(0, 300));
    }
    const j = await r.json();
    let txt = (((j.candidates || [])[0] || {}).content || {}).parts;
    txt = txt && txt.map(p => p.text || '').join('');
    if (!txt) throw new Error('Réponse vide, réessaie.');
    txt = txt.replace(/^```json\s*/i, '').replace(/```\s*$/, '').trim();
    return JSON.parse(txt);
  }
}

const SYS_IDEES = `Tu es scénariste de mini-histoires de couple pour Reels, en français. Ton métier : observer la vraie vie des couples et la transformer en petites histoires qui donnent l'impression d'être filmées chez de vrais gens.

PRINCIPE CENTRAL
Une histoire vraie ne part jamais d'un thème (« la jalousie », « la complicité »). Elle part d'un détail minuscule et précis que tout le monde a déjà vécu : un objet, une habitude, un geste, une phrase dite à moitié, un silence. Le spectateur doit se dire « c'est exactement nous » ou « c'est exactement mon couple ».

COMMENT LES GENS SE COMPORTENT VRAIMENT
- Ils ne disent presque jamais ce qu'ils ressentent. L'émotion passe par le sous-texte : ce qu'on fait à la place de le dire (un verre d'eau apporté sans un mot, une couette remontée, un message « t'es où ? » qui veut dire « tu me manques »).
- Les dialogues sont courts, imparfaits, interrompus, banals. Pas de belles phrases, pas de tirades, pas de « je t'aime » prononcé de façon appuyée.
- Une petite tension ne se règle pas par une discussion mûre : elle se dissout par un geste, un regard, un rire en même temps, un détail partagé.
- Chacun a ses manies, ses mauvaises habitudes, sa façon d'aimer (ou de mal le montrer). L'attachement vient de ces défauts qu'on finit par trouver touchants.
- Les couples ont des codes à eux : un surnom, une phrase récurrente, un rituel, une blague que personne d'autre ne comprend.

ENTRE LUI ET ELLE
Les idées découlent de la personnalité décrite et de la dynamique entre eux : qui parle, qui se tait, qui range, qui oublie, qui cède en premier. Deux idées ne doivent pas pouvoir être échangées entre deux autres couples.

À ÉVITER ABSOLUMENT
Gags, chutes de sitcom, quiproquos théâtraux, surprises romantiques mises en scène, dîners aux chandelles, déclarations, grandes disputes, réconciliations spectaculaires, morale finale, situations génériques qui pourraient arriver à n'importe qui.

TERRAINS À VARIER (exemples, pas une liste fermée)
le réveil, la salle de bain, la cuisine, les courses, le trajet en voiture, la voiture garée, le canapé et la série du soir, le lit et la couette, le téléphone et les messages, le linge, le ménage, le rangement, la valise, les repas de famille, les amis, les cadeaux, l'argent du quotidien, le sommeil, la maladie, la météo, les week-ends sans rien, les rituels du matin ou du soir.

ATTACHEMENT ET PARTAGE
Chaque idée doit pouvoir déclencher « envoie ça à ton chéri / ta chérie », et faire aimer les deux personnages assez pour vouloir suivre la suite. Pense à des détails qui reviennent d'une histoire à l'autre (un objet, une habitude, une phrase) pour construire un univers.

Les émotions humaines sont toutes permises, y compris les larmes. Pas de violence ni de gore.
N'invente rien sur l'apparence physique des personnes ni sur leurs vêtements.

Réponds uniquement en JSON : {"idees":[{"titre":"","terrain":"","situation":"","tension":"","desamorcage":"","fin":"","pourquoi":"","accroche":""}]}
- titre : court, concret, basé sur le détail
- terrain : le lieu ou le moment (un ou deux mots)
- situation : la scène banale de départ avec son détail précis, 1 à 2 phrases
- tension : le petit décalage entre eux, 1 phrase
- desamorcage : le geste ou la phrase simple qui adoucit, 1 phrase
- fin : l'image ou le détail final, sans morale, 1 phrase
- pourquoi : pourquoi les gens s'y reconnaissent et le partagent, 1 phrase
- accroche : le texte à l'écran en 1 ligne, naturel, pas publicitaire`;

const SYS_DEV = `Tu es scénariste de mini-histoires de couple pour Reels, en français. Tu développes une idée en mini-histoire de 15 à 30 secondes, filmable, qui donne l'impression d'être prise sur le vif chez de vrais gens.

RÈGLES D'ÉCRITURE
- Pars du détail précis de l'idée et reste dessus : rien de grandiose, aucun gag, aucune chute de sitcom.
- Les personnages ne disent pas ce qu'ils ressentent : l'émotion passe par des gestes, des silences, des regards, des petites actions.
- Les répliques sont courtes, banales, imparfaites, comme dans la vraie vie : phrases coupées, mots de tous les jours, pas de belles formules, pas de tirade, pas de déclaration appuyée. Beaucoup de scènes peuvent n'avoir aucune réplique.
- Chacun parle et agit selon sa personnalité telle que décrite.
- La tension reste petite et se dissout par un geste ou un détail, pas par une discussion.
- La fin est une image simple, sans morale ni explication.
- Toutes les émotions humaines sont permises, y compris les larmes. Pas de gore.
- N'invente rien sur l'apparence physique ni sur les vêtements.

Réponds uniquement en JSON : {"duree":"","scenes":[{"numero":1,"lieu":"","action":"","replique":""}],"texte_ecran":"","legende":"","suite":""}
- 4 à 6 scènes. action : ce qui se passe, concret, filmable, sans décrire l'apparence. replique : une courte phrase naturelle dite par l'un des deux (précise qui parle), ou chaîne vide si silence.
- texte_ecran : le texte affiché à l'écran, court et naturel
- legende : légende Instagram courte qui invite à taguer l'autre
- suite : une piste pour l'épisode suivant, qui reprend un détail ou un rituel pour donner envie de revenir`;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function persoBlock() {
  const n1 = $('#n1').value.trim() || 'Lui', n2 = $('#n2').value.trim() || 'Elle';
  let t = 'Personnage 1 (homme) : ' + n1 + '\nPersonnalité : ' + ($('#p1').value.trim() || 'non précisée') + '\n\n';
  t += 'Personnage 2 (femme) : ' + n2 + '\nPersonnalité : ' + ($('#p2').value.trim() || 'non précisée') + '\n';
  const c = $('#ctx').value.trim();
  if (c) t += '\nContexte du couple : ' + c + '\n';
  return t;
}

function buildParts(extra) {
  const parts = [];
  if (mode === 'photo') {
    if (photos[1]) { parts.push({ text: 'Photo du personnage 1 :' }); parts.push({ inlineData: { mimeType: 'image/jpeg', data: photos[1].b64 } }); }
    if (photos[2]) { parts.push({ text: 'Photo du personnage 2 :' }); parts.push({ inlineData: { mimeType: 'image/jpeg', data: photos[2].b64 } }); }
    parts.push({ text: "Des photos sont fournies : utilise uniquement ce qui est visible comme ambiance, attitude, lieu et situation. Ne décris ni le visage, ni les cheveux, ni l'expression, ni les vêtements. N'invente rien qui ne soit pas visible." });
  }
  parts.push({ text: persoBlock() + (extra || '') });
  return parts;
}

function validate() {
  if (mode === 'texte' && !$('#p1').value.trim() && !$('#p2').value.trim()) return 'Décris au moins un des deux.';
  if (mode === 'photo' && !photos[1] && !photos[2] && !$('#p1').value.trim() && !$('#p2').value.trim()) return 'Ajoute au moins une photo.';
  return '';
}

function setBusy(btn, busy, label) {
  btn.disabled = busy;
  btn.innerHTML = busy ? '<span class="spin"></span>' + label : label;
}

$('#go').addEventListener('click', async () => {
  showErr('');
  const v = validate(); if (v) { showErr(v); return; }
  const btn = $('#go'), orig = 'Trouver des idées d\'histoires';
  setBusy(btn, true, 'Écriture des idées…');
  try {
    const nb = $('#nb').value;
    const j = await gemini(buildParts('\nPropose exactement ' + nb + ' idées d\'histoires différentes.'), SYS_IDEES);
    lastIdeas = (j.idees || []).slice(0, +nb);
    render();
  } catch (e) { showErr(e.message); }
  setBusy(btn, false, orig);
});

function render() {
  const out = $('#out');
  out.innerHTML = '';
  lastIdeas.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'card idea';
    d.innerHTML =
      '<span class="tag">' + esc(it.terrain) + '</span>' +
      '<h3>' + (i + 1) + '. ' + esc(it.titre) + '</h3>' +
      '<div class="k">Situation</div><div>' + esc(it.situation) + '</div>' +
      '<div class="k">Petite tension</div><div>' + esc(it.tension) + '</div>' +
      '<div class="k">Ce qui désamorce</div><div>' + esc(it.desamorcage) + '</div>' +
      '<div class="k">Fin</div><div>' + esc(it.fin) + '</div>' +
      '<div class="k">Pourquoi ça attache</div><div>' + esc(it.pourquoi) + '</div>' +
      '<div class="hook">' + esc(it.accroche) + '</div>' +
      '<div class="actions"><button class="btn sm" data-i="' + i + '">Développer cette histoire</button></div>' +
      '<div class="dev" style="display:none"></div>';
    out.appendChild(d);
  });
  out.querySelectorAll('button[data-i]').forEach(b => b.addEventListener('click', () => develop(+b.dataset.i, b)));
  if (lastIdeas.length) out.scrollIntoView({ behavior: 'smooth' });
}

async function develop(i, btn) {
  showErr('');
  const it = lastIdeas[i];
  const dev = btn.closest('.idea').querySelector('.dev');
  const orig = btn.dataset.label || btn.textContent;
  btn.dataset.label = orig;
  setBusy(btn, true, 'Écriture…');
  try {
    const extra = '\nIdée à développer :\nTitre : ' + it.titre + '\nTerrain : ' + it.terrain + '\nSituation : ' + it.situation + '\nTension : ' + it.tension + '\nDésamorçage : ' + it.desamorcage + '\nFin : ' + it.fin;
    const j = await gemini(buildParts(extra), SYS_DEV);
    let h = '<div class="k" style="margin-top:0">Mini-histoire · ' + esc(j.duree || '15-30 s') + '</div>';
    (j.scenes || []).forEach(s => {
      h += '<div class="scene"><b>Scène ' + esc(s.numero) + ' · ' + esc(s.lieu) + '</b><div>' + esc(s.action) + '</div>' +
           (s.replique ? '<div style="color:var(--rose2);margin-top:4px">« ' + esc(s.replique) + ' »</div>' : '') + '</div>';
    });
    h += '<div class="k">Texte à l\'écran</div><div class="hook">' + esc(j.texte_ecran) + '</div>';
    h += '<div class="k">Légende</div><div>' + esc(j.legende) + '</div>';
    h += '<div class="k">Piste pour la suite</div><div>' + esc(j.suite) + '</div>';
    h += '<div class="actions"><button class="btn sm ghost cp">Copier l\'histoire</button></div>';
    dev.innerHTML = h; dev.style.display = 'block';
    const txt = (j.scenes || []).map(s => 'Scène ' + s.numero + ' (' + s.lieu + ') : ' + s.action + (s.replique ? '\n« ' + s.replique + ' »' : '')).join('\n\n') +
      '\n\nTexte à l\'écran : ' + j.texte_ecran + '\nLégende : ' + j.legende;
    dev.querySelector('.cp').addEventListener('click', async e => {
      try { await navigator.clipboard.writeText(txt); e.target.textContent = 'Copié'; }
      catch (x) { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); e.target.textContent = 'Copié'; }
    });
  } catch (e) { showErr(e.message); }
  setBusy(btn, false, orig);
}
</script>
</body>
</html>
