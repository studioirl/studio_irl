<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>STUDIO HOT — Your Private Creative Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090909;--bg2:#151112;--card:#21191B;--card2:#2a2023;
  --red:#A10F27;--red-d:#650D1D;--red-l:#C51D3A;
  --ivory:#F2ECE8;--grey:#AAA1A0;--gold:#B89A6A;
  --line:rgba(242,236,232,.08);--line2:rgba(242,236,232,.16);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif;
  --r:16px;--sb:252px;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ivory);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
::selection{background:var(--red);color:var(--ivory)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.ic{flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Typography ---------- */
.eyebrow{font:500 11px/1.4 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.eyebrow.grey{color:var(--grey)}
h1,.h1{font:500 clamp(36px,5vw,58px)/1.02 var(--serif);letter-spacing:-.01em}
h2,.h2{font:500 clamp(26px,3vw,34px)/1.1 var(--serif)}
h3,.h3{font:500 22px/1.2 var(--serif)}
h4{font:600 12px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.it{font-style:italic}
.muted{color:var(--grey)}
.small{font-size:13px}
.xs{font-size:12px}
p+p{margin-top:.7em}

/* ---------- Logo ---------- */
.logo{display:inline-flex;flex-direction:column;line-height:1;user-select:none}
.logo .l1{font:500 10px/1 var(--sans);letter-spacing:.62em;color:var(--grey);padding-left:2px}
.logo .l2{font:500 34px/.9 var(--serif);letter-spacing:.14em;margin-top:6px}
.logo .l2 i{font-style:italic;color:var(--red-l);letter-spacing:.06em}
.logo.h{flex-direction:row;align-items:baseline;gap:12px}
.logo.h .l2{margin-top:0}
.logo.big .l1{font-size:13px}
.logo.big .l2{font-size:clamp(64px,11vw,120px)}
.logo.mono .l2 i{color:inherit}
.logo.red{color:var(--red-l)}.logo.red .l1{color:var(--red-l)}.logo.red .l2 i{color:var(--red-l)}
.logo.light{color:#151112}.logo.light .l1{color:#5a4e4f}
.appicon{width:64px;height:64px;border-radius:16px;background:radial-gradient(120% 120% at 30% 20%,#3a0a14,#090909 70%);border:1px solid var(--line2);display:grid;place-items:center;font:500 italic 30px/1 var(--serif);color:var(--red-l)}
.signature{font:400 italic 15px/1.4 var(--serif);letter-spacing:.18em;color:var(--grey);text-transform:uppercase}

/* ---------- Layout ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:30px 16px 22px;z-index:20}
.sidebar .logo{padding:0 12px 34px}
.nav{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:10px;font-size:13.5px;color:var(--grey);text-decoration:none;cursor:pointer;border:none;background:none;text-align:left;transition:color .2s,background .2s}
.navitem:hover{color:var(--ivory);background:rgba(242,236,232,.04)}
.navitem.active{color:var(--ivory);background:rgba(161,15,39,.16)}
.navitem.active .ic{color:var(--red-l)}
.sb-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);font-size:12px;color:var(--grey)}
.sb-couple{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;text-align:left;width:100%}
.avatars{display:flex}
.av{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1.5px solid var(--bg2);display:grid;place-items:center;font:500 13px var(--serif);color:var(--ivory);overflow:hidden}
.av+.av{margin-left:-10px}
.av img{width:100%;height:100%;object-fit:cover}
main{margin-left:var(--sb);min-height:100vh}
.page{max-width:1200px;margin:0 auto;padding:44px 48px 90px}
.mtop{display:none}
.bottomnav{display:none}
@media (max-width:900px){
  .sidebar{display:none}
  main{margin-left:0}
  .page{padding:18px 18px 120px}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px;position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);z-index:15}
  .mtop .logo .l2{font-size:24px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(21,17,18,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:30;justify-content:space-around}
  .bn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;min-width:62px;border:none;background:none;color:var(--grey);font-size:10.5px;letter-spacing:.04em;cursor:pointer;text-decoration:none}
  .bn.active{color:var(--ivory)}
  .bn.active .ic{color:var(--red-l)}
}

/* ---------- Page header ---------- */
.ph{margin-bottom:34px}
.ph .eyebrow{margin-bottom:14px}
.ph p{max-width:620px;margin-top:12px;color:var(--grey)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{margin-top:52px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:700px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.sticky{position:sticky;top:24px}
@media (max-width:1100px){.sticky{position:static}}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.card.flat{background:var(--bg2)}
.card.tight{padding:18px}
.ed{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);min-height:200px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;text-align:left;color:var(--ivory);background:var(--card);transition:transform .45s var(--ease),border-color .3s}
.ed:hover{transform:translateY(-3px);border-color:var(--line2)}
.ed::before{content:"";position:absolute;inset:0;background:var(--bgimg,radial-gradient(90% 80% at 70% 10%,rgba(161,15,39,.55),transparent 60%),radial-gradient(70% 60% at 10% 100%,rgba(184,154,106,.18),transparent 70%));transition:opacity .4s;z-index:0}
.ed::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(9,9,9,.85));z-index:0}
.ed>*{position:relative;z-index:1}
.ed .h3{margin-top:8px}
.ed p{font-size:13px;color:var(--grey);margin-top:6px;max-width:42ch}
.ed .go{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;opacity:.7;transition:.3s}
.ed:hover .go{opacity:1;background:var(--red);border-color:var(--red)}
.quick{min-height:170px}
.quick .num{font:400 italic 15px var(--serif);color:var(--gold)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 22px;border-radius:999px;font:500 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;border:1px solid transparent;background:none;cursor:pointer;transition:background .25s,border-color .25s,color .25s,opacity .25s;white-space:nowrap;text-decoration:none;color:var(--ivory)}
.btn-p{background:var(--red)}
.btn-p:hover{background:var(--red-l)}
.btn-p:active,.btn-p.active{background:var(--red-d)}
.btn-s{border-color:var(--line2)}
.btn-s:hover{border-color:var(--ivory)}
.btn-s.active{border-color:var(--red-l);color:var(--red-l)}
.btn-g{color:var(--grey);padding:0 12px}
.btn-g:hover{color:var(--ivory)}
.btn-d{border-color:rgba(197,29,58,.45);color:#e8798b}
.btn-d:hover{background:rgba(197,29,58,.12)}
.btn-sm{height:34px;padding:0 15px;font-size:11px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.36;cursor:not-allowed}
.btn.loading{pointer-events:none;opacity:.75}
.btn.loading::after{content:"";width:13px;height:13px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.btn.err{border-color:var(--red-l);color:var(--red-l)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--grey);transition:.2s;flex-shrink:0}
.ib:hover{color:var(--ivory);border-color:var(--line2)}
.ib.on{color:var(--gold);border-color:rgba(184,154,106,.5)}
.ib.sm{width:30px;height:30px}
.ib:disabled{opacity:.3;cursor:not-allowed}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Badges ---------- */
.bd{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font:500 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line2);color:var(--grey);white-space:nowrap}
.bd::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bd.dispo{color:#8fc59b;border-color:rgba(143,197,155,.3)}
.bd.demo{color:var(--gold);border-color:rgba(184,154,106,.35)}
.bd.config{color:#e8798b;border-color:rgba(232,121,139,.35)}
.bd.dev,.bd.content{color:var(--grey)}
.tag{display:inline-block;padding:3px 9px;border-radius:6px;background:rgba(242,236,232,.06);font-size:11px;color:var(--grey);letter-spacing:.03em}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:var(--grey);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.field em{font-style:normal;text-transform:none;letter-spacing:0;color:#776d6d;font-weight:400}
.field input,.field textarea,.field select{background:var(--bg);border:1px solid var(--line2);border-radius:11px;padding:12px 14px;color:var(--ivory);font:400 14.5px/1.5 var(--sans);letter-spacing:0;text-transform:none;transition:border-color .2s;width:100%}
.field textarea{resize:vertical;min-height:84px}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--grey) 50%),linear-gradient(135deg,var(--grey) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);outline:none}
.field input::placeholder,.field textarea::placeholder{color:#5e5556}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fgrid .full{grid-column:1/-1}
@media (max-width:700px){.fgrid{grid-template-columns:1fr}}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ivory);cursor:pointer;line-height:1.45}
.check input{appearance:none;width:20px;height:20px;border:1.5px solid var(--line2);border-radius:6px;flex-shrink:0;margin-top:1px;display:grid;place-items:center;cursor:pointer;transition:.2s;background:var(--bg)}
.check input:checked{background:var(--red);border-color:var(--red)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--ivory);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:none;color:var(--grey);font:400 13px var(--sans);cursor:pointer;transition:.2s;white-space:nowrap}
.chip:hover{color:var(--ivory);border-color:rgba(242,236,232,.35)}
.chip.on{background:rgba(161,15,39,.2);border-color:var(--red-l);color:var(--ivory)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.wrap{white-space:normal;height:auto;min-height:36px;padding:8px 15px;text-align:left;line-height:1.35;max-width:100%}
main{overflow-x:hidden}
.page,.split>*,.fgrid>*,.g2>*,.g3>*,.g4>*{min-width:0}
.block{margin-top:30px}
.block>h4{margin-bottom:14px;display:flex;align-items:center;gap:10px}
.block>h4 .n{font:400 italic 15px var(--serif);color:var(--gold);letter-spacing:0;text-transform:none}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:28px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;border:none;background:none;color:var(--grey);font:500 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ivory)}
.tab.on{color:var(--ivory);border-color:var(--red-l)}
.tab .cnt{color:var(--gold);margin-left:6px}

/* ---------- Style gallery ---------- */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sty{position:relative;height:118px;border-radius:13px;border:1px solid var(--line);overflow:hidden;cursor:pointer;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;background:var(--card);color:var(--ivory);transition:.25s}
.sty::before{content:"";position:absolute;inset:0;background:var(--sw);opacity:.9}
.sty::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(9,9,9,.85))}
.sty>*{position:relative;z-index:1}
.sty b{font:500 17px/1.1 var(--serif)}
.sty span{font-size:11px;color:var(--grey);margin-top:3px;line-height:1.3}
.sty.on{border-color:var(--red-l);box-shadow:0 0 0 1px var(--red-l) inset}
.sty:hover{border-color:var(--line2)}

/* ---------- Gallery / refs ---------- */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.ref{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);aspect-ratio:3/4}
.ref img{width:100%;height:100%;object-fit:cover}
.ref .rbar{position:absolute;left:0;right:0;bottom:0;padding:8px;display:flex;gap:6px;align-items:center;justify-content:space-between;background:linear-gradient(transparent,rgba(9,9,9,.92))}
.ref .rtop{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px}
.ref.sel{border-color:var(--red-l);box-shadow:0 0 0 2px var(--red-l)}
.ref.pick{cursor:pointer}
.ref .num{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;font:600 12px var(--sans)}
.ref .ib{background:rgba(9,9,9,.7)}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:26px;text-align:center;color:var(--grey);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pcard{display:flex;gap:16px;align-items:center}
.pcard .pimg{width:64px;height:64px;border-radius:50%;background:var(--card2);overflow:hidden;display:grid;place-items:center;font:500 24px var(--serif);border:1px solid var(--line2);flex-shrink:0}
.pcard .pimg img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:13.5px}
.kv dt{color:var(--grey);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.kv dd{color:var(--ivory)}
@media (max-width:600px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:8px}}

/* ---------- Prompt editor ---------- */
.prompt{width:100%;min-height:340px;background:#0c0a0b;border:1px solid var(--line2);border-radius:13px;padding:18px;color:var(--ivory);font:400 13px/1.65 ui-monospace,'SF Mono',Menlo,monospace;resize:vertical}
.prompt:focus{outline:none;border-color:var(--gold)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:rgba(161,15,39,.09);border:1px solid rgba(197,29,58,.25);font-size:13px;color:#e9c7cc;line-height:1.5}
.notice.gold{background:rgba(184,154,106,.08);border-color:rgba(184,154,106,.28);color:#e0d2bb}
.notice.neutral{background:rgba(242,236,232,.04);border-color:var(--line);color:var(--grey)}

/* ---------- Timeline ---------- */
.tlbar{display:flex;height:46px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);margin:6px 0 18px}
.tlbar div{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ivory);border-right:1px solid rgba(9,9,9,.6);padding:0 6px;text-align:center;line-height:1.2;overflow:hidden}
.tlbar div:last-child{border-right:none}
.seg{border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:16px;margin-bottom:12px}
.seg-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.seg-h .tc{font:500 italic 18px var(--serif);color:var(--gold);min-width:84px}
.seg-h input.mini{width:62px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;color:var(--ivory);font:400 13px var(--sans)}
.seg-h input.lbl{flex:1;min-width:140px;background:none;border:none;border-bottom:1px solid var(--line2);color:var(--ivory);font:500 15px var(--serif);padding:4px 2px}
.seg .fgrid{gap:12px}
.seg .field input,.seg .field textarea,.seg .field select{padding:9px 12px;font-size:13.5px}
.seg .field textarea{min-height:60px}

/* ---------- Library ---------- */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.lib{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;color:var(--ivory);transition:.3s}
.lib:hover{border-color:var(--line2);transform:translateY(-2px)}
.lib .thumb{height:130px;background:var(--th,radial-gradient(80% 90% at 70% 20%,rgba(161,15,39,.45),transparent 65%),var(--bg2));position:relative;display:flex;align-items:flex-end;padding:12px}
.lib .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lib .thumb .bd{position:relative;background:rgba(9,9,9,.7)}
.lib .body{padding:16px}
.lib .body b{font:500 19px/1.2 var(--serif);display:block}
.lib .body .meta{font-size:12px;color:var(--grey);margin-top:6px}
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--grey)}
.empty .h3{color:var(--ivory);margin-bottom:8px}
.empty .btn{margin-top:20px}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.hscroll>*{flex:0 0 250px;scroll-snap-align:start}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(5,4,4,.78);backdrop-filter:blur(6px)}
.modal.open{display:flex;animation:fade .25s var(--ease)}
.dialog{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;width:min(760px,100%);max-height:calc(100vh - 48px);overflow:auto;padding:30px;position:relative;animation:rise .35s var(--ease)}
.dialog.sm{width:min(440px,100%)}
.dialog .x{position:absolute;top:16px;right:16px}
@media (max-width:700px){.modal{align-items:flex-end;padding:0}.dialog{border-radius:20px 20px 0 0;max-height:92vh;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}}
.toasts{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--line2);border-left:3px solid var(--gold);border-radius:10px;padding:12px 16px;font-size:13.5px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .3s var(--ease)}
.toast.err{border-left-color:var(--red-l)}
.toast.ok{border-left-color:#8fc59b}

/* ---------- Splash ---------- */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;background:radial-gradient(60% 50% at 50% 38%,rgba(161,15,39,.28),transparent 70%),radial-gradient(40% 30% at 70% 80%,rgba(184,154,106,.08),transparent 70%),var(--bg)}
.splash .logo{align-items:center;animation:rise 1.2s var(--ease)}
.splash .signature{margin-top:26px}
.splash .gate{margin-top:56px;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:22px;animation:fade 1.6s var(--ease)}
.splash .check{text-align:left;font-size:13.5px;color:var(--grey)}
.onb{max-width:820px;margin:0 auto;padding:60px 24px 100px}
.onb-head{text-align:center;margin-bottom:46px}
.onb-head .h1{margin:18px 0 12px}
details.more{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
details.more summary{cursor:pointer;color:var(--gold);font-size:13px;letter-spacing:.08em;text-transform:uppercase;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:18px}

/* ---------- Status table ---------- */
.status{width:100%;border-collapse:collapse;font-size:13.5px}
.status td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.status td:first-child{padding-left:0}
.status td:last-child{text-align:right;padding-right:0}
.swatches{display:flex;gap:6px}
.swatches i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:block}

/* ---------- Animations ---------- */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.anim>*{animation:rise .55s var(--ease) both}
.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}.anim>*:nth-child(5){animation-delay:.2s}.anim>*:nth-child(6){animation-delay:.25s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.rm *,body.rm *::before,body.rm *::after{animation:none!important;transition:none!important}
hr.sep{border:none;border-top:1px solid var(--line);margin:28px 0}

/* ---------- Data layer (IndexedDB) ---------- */
/* Stockage robuste : IndexedDB avec reconnexion automatique.
   Si le navigateur ferme ou refuse la base (aperçu intégré, navigation privée),
   bascule sur un stockage temporaire en mémoire, sans planter. */
const DB={
 db:null,mem:null,
 openIDB(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('studio-hot',1)}catch(e){return rej(e)}
  const t=setTimeout(()=>rej(new Error('timeout')),4000);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('records')){const s=d.createObjectStore('records',{keyPath:'id'});s.createIndex('type','type')}if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};
  r.onsuccess=()=>{clearTimeout(t);const d=r.result;d.onclose=()=>{if(this.db===d)this.db=null};d.onversionchange=()=>{d.close();if(this.db===d)this.db=null};res(d)};
  r.onerror=()=>{clearTimeout(t);rej(r.error)};r.onblocked=()=>{clearTimeout(t);rej(new Error('blocked'))}})},
 async open(){if(this.mem||this.db)return;try{this.db=await this.openIDB()}catch(e){console.warn('IndexedDB indisponible',e);this.useMem()}},
 useMem(){if(this.mem)return;this.db=null;this.mem={records:new Map(),blobs:new Map()};
  [S.couple,S.partners?.p1,S.partners?.p2,...(S.assets||[]),...(S.outfits||[]),...(S.memory||[]),...(S.creations||[]),...(S.links||[])].filter(Boolean).forEach(r=>this.mem.records.set(r.id,r));
  if(S.settings&&Object.keys(S.settings).length)this.mem.records.set('settings',{id:'settings',type:'setting',data:S.settings});
  setTimeout(()=>{toast('Stockage temporaire activé : ce navigateur bloque la sauvegarde. Ouvre le studio depuis son lien web pour garder tes données.','err');if(S.couple)rerender()},0)},
 req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async op(store,mode,idbFn,memFn){
  for(let i=0;i<3;i++){
   if(this.mem)return memFn(this.mem[store]);
   try{if(!this.db)await this.open();if(this.mem)return memFn(this.mem[store]);return await this.req(idbFn(this.db.transaction(store,mode).objectStore(store)))}
   catch(e){if(e&&(e.name==='InvalidStateError'||e.name==='TransactionInactiveError'||/clos/i.test(e.message||''))){try{this.db&&this.db.close()}catch(_){}this.db=null;continue}throw e}
  }
  this.useMem();return memFn(this.mem[store])},
 put(rec){rec.updated_at=now();if(!rec.created_at)rec.created_at=rec.updated_at;return this.op('records','readwrite',s=>s.put(rec),m=>{m.set(rec.id,rec)}).then(()=>rec)},
 get(id){return this.op('records','readonly',s=>s.get(id),m=>m.get(id))},
 all(){return this.op('records','readonly',s=>s.getAll(),m=>[...m.values()])},
 del(id){return this.op('records','readwrite',s=>s.delete(id),m=>{m.delete(id)})},
 putBlob(k,b){return this.op('blobs','readwrite',s=>s.put(b,k),m=>{m.set(k,b)})},
 getBlob(k){return this.op('blobs','readonly',s=>s.get(k),m=>m.get(k))},
 delBlob(k){return this.op('blobs','readwrite',s=>s.delete(k),m=>{m.delete(k)})},
 clearAll(){return Promise.all(['records','blobs'].map(s=>this.op(s,'readwrite',x=>x.clear(),m=>{m.clear()})))}
};
const URLS={};
async function blobURL(id){if(URLS[id])return URLS[id];const b=await DB.getBlob(id);if(!b)return '';return URLS[id]=URL.createObjectURL(b)}
function dropURL(id){if(URLS[id]){URL.revokeObjectURL(URLS[id]);delete URLS[id]}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});

/* ---------- kie.ai (génération d'images) ----------
   Upload base64 -> createTask -> polling recordInfo (state). */
const KIE_MODELS=[{v:'nano-banana-pro',l:'Nano Banana Pro'},{v:'nano-banana-2',l:'Nano Banana 2'}];
const KIE={
 upBase:'https://kieai.redpandaai.co/api/file-base64-upload',
 api:'https://api.kie.ai/api/v1',
 urlCache:{},
 headers(){return{'Authorization':'Bearer '+S.settings.kieKey,'Content-Type':'application/json'}},
 async json(res){let j;try{j=await res.json()}catch(e){throw new Error('Réponse illisible de kie.ai ('+res.status+').')}
  const code=j&&j.code;
  if(res.status===401||code===401)throw new Error('Clé kie.ai invalide ou expirée.');
  if(res.status===402||code===402)throw new Error('Crédits kie.ai insuffisants.');
  if(res.status===429||code===429){const e=new Error('kie.ai est saturé, nouvel essai…');e.retry=true;throw e}
  if(!res.ok||(code&&code!==200))throw new Error((j&&j.msg)||('Erreur kie.ai '+res.status+'.'));return j},
 async call(url,opt,tries=4){for(let i=0;i<tries;i++){try{let res;try{res=await fetch(url,opt)}catch(e){const er=new Error('Connexion à kie.ai impossible.');er.retry=true;throw er}return await this.json(res)}catch(e){if(e.retry&&i<tries-1){await sleep(1500*2**i);continue}throw e}}},
 async credits(){const j=await this.call(this.api+'/chat/credit',{headers:this.headers()},1);return j.data},
 async upload(assetId){if(this.urlCache[assetId])return this.urlCache[assetId];const b=await DB.getBlob(assetId);if(!b)throw new Error('Photo de référence introuvable.');
  const ext=((b.type||'image/jpeg').split('/')[1]||'jpg').replace('jpeg','jpg');
  const j=await this.call(this.upBase,{method:'POST',headers:this.headers(),body:JSON.stringify({base64Data:await blobToDataURL(b),uploadPath:'studio-hot',fileName:assetId+'.'+ext})});
  const u=j.data&&(j.data.downloadUrl||j.data.fileUrl||j.data.url);if(!u)throw new Error('Upload kie.ai : adresse du fichier manquante.');return this.urlCache[assetId]=u},
 async create(model,input){const j=await this.call(this.api+'/jobs/createTask',{method:'POST',headers:this.headers(),body:JSON.stringify({model,input})});const id=j.data&&j.data.taskId;if(!id)throw new Error('kie.ai n’a pas renvoyé de tâche.');return id},
 async poll(taskId,onState){const t0=Date.now();while(Date.now()-t0<6*60*1000){await sleep(3000);const j=await this.call(this.api+'/jobs/recordInfo?taskId='+encodeURIComponent(taskId),{headers:this.headers()});const d=j.data||{};onState&&onState(d.state);
  if(d.state==='success'){let r=d.resultJson;if(typeof r==='string'){try{r=JSON.parse(r)}catch(e){r={}}}const urls=(r&&r.resultUrls)||[];if(!urls.length)throw new Error('kie.ai n’a renvoyé aucune image.');return urls}
  if(d.state==='fail')throw new Error(d.failMsg||'Génération refusée ou échouée.')}
  throw new Error('Délai dépassé (6 min). La tâche continue peut-être sur kie.ai.')}
};

function detectIntent(t){const s=t.toLowerCase();const rules=[['video',/vid[ée]o|seedance|prompt vid|\bclip\b/],['image',/\bimages?\b|\bphotos?\b|portrait|visuel|shooting/],['roleplay',/jeu de r[ôo]le|roleplay|\br[ôo]les?\b|incarner/],['game',/\bjeux?\b|d[ée]fis?\b|challenge|\bgame\b/],['scene',/sc[èe]ne|sc[ée]nario|mise en sc[èe]ne/],['experience',/soir[ée]e|exp[ée]rience|ce soir|rendez-vous|week-end|surprise/]];for(const [k,r] of rules)if(r.test(s))return k;return null}

function blankImg(){const refs=['p1','p2'].map(primaryAsset).filter(a=>a&&hasConsent(a.partner_id)).map(a=>a.id);return{id:null,fromId:null,chars:'both',customChars:'',refs,style:'cinematic',styleCustom:'',situation:'portrait',decor:'Hôtel',decorCustom:'',outfits:{p1:'',p2:''},outfitDesc:{p1:'',p2:''},intensity:'romantic',desc:'',ratio:'auto',count:1,useAppearance:false,prompt:'',edited:false,versions:[],results:[],busy:false,phase:'',err:''}}
function buildImagePrompt(st){
 const ids=charIds(st.chars);
 const names=st.chars==='custom'?(st.customChars.trim()||'personnages personnalisés'):ids.map(pn).join(' et ');
 const sit=SITUATIONS.find(s=>s.id===st.situation);
 const style=STYLES.find(s=>s.id===st.style)||STYLES[0];
 const L=[];
 L.push(`${st.chars==='both'?'Photographie de couple':'Photographie'} : ${names}${sit&&sit.fr?` — ${sit.fr}`:''}.`);
 const refs=st.refs.map(id=>S.assets.find(a=>a.id===id)).filter(Boolean);
 if(refs.length){L.push('','RÉFÉRENCES');refs.forEach((a,i)=>{const who=a.partner_id==='couple'?'du couple':'de '+pn(a.partner_id);const rule=IDENTITY_CATS.includes(a.category)?' — conserver strictement son identité et ses traits.':a.category==='Outfit'?' — reproduire uniquement le vêtement.':a.category==='Decor'?' — reproduire uniquement le décor.':'.';L.push(`Image ${i+1} : ${catFr(a.category)} ${who}${rule}`)})}
 if(st.useAppearance){const ap=ids.map(p=>{const r=S.partners[p];if(!r?.appearance_validated)return null;const bits=[r.hair_color&&('cheveux '+r.hair_color+(r.hair_length?', '+r.hair_length:'')),r.eyes&&('yeux '+r.eyes),r.skin&&('teint '+r.skin),r.morphology,r.particularities].filter(Boolean);return bits.length?`${pn(p)} : ${bits.join(', ')}.`:null}).filter(Boolean);if(ap.length)L.push('','IDENTITÉ VALIDÉE',...ap)}
 if(st.desc.trim())L.push('','ACTION ET COMPOSITION',st.desc.trim());
 const decor=st.decor==='Décor personnalisé'?st.decorCustom.trim():st.decor;
 if(decor)L.push('','DÉCOR',decor+'.');
 const w=[];ids.forEach(p=>{const o=S.outfits.find(x=>x.id===st.outfits[p]);const free=(st.outfitDesc[p]||'').trim();if(o)w.push(`${pn(p)} porte : ${o.description||o.name}.`);else if(free)w.push(`${pn(p)} porte : ${free}.`)});
 if(w.length)L.push('','TENUES',...w);
 L.push('','DIRECTION PHOTOGRAPHIQUE');
 if(style.id==='custom'){if(st.styleCustom.trim())L.push(st.styleCustom.trim())}
 else{L.push(`Style ${style.name} : ${style.desc.replace(/\.$/,'')}.`);L.push(`Éclairage : ${style.light}.`,`Palette : ${style.palette}.`,`Objectif : ${style.lens}, ${style.dof}.`,`Texture : ${style.texture}.`)}
 const it=INTENSITIES.find(i=>i.id===st.intensity);if(it)L.push(`Ambiance : ${it.fr}.`);
 if(refs.some(a=>IDENTITY_CATS.includes(a.category)))L.push('','CONTINUITÉ','Préserver la ressemblance de chaque personne avec ses images de référence. Ne pas modifier visage, silhouette ni traits.');
 return L.join('\n');
}

/* ---------- Video Studio ---------- */
function blankVid(){const refs=['p1','p2'].map(primaryAsset).filter(a=>a&&hasConsent(a.partner_id)).map(a=>a.id);return{id:null,fromId:null,mode:'idea',sourceId:null,sourceAsset:null,imageDesc:'',title:'',idea:'',duration:10,ratio:'9:16',style:'Contemporary Cinematic',intensity:'romantic',lens:'35 mm',move:'Steadicam',location:'',chars:'both',refs,outfits:{p1:'',p2:''},outfitDesc:{p1:'',p2:''},language:'Français',accent:'',sound:'',constraints:'',segments:[],prompt:'',edited:false}}
function splitSegments(d){const ends=[Math.round(d*.2),Math.round(d*.4),Math.round(d*.67),d];const labels=['Situation initiale','Action principale','Évolution de la proximité','Payoff final'];let s=0;return ends.map((e,i)=>{const seg={id:uid('seg'),label:labels[i],start:s,end:Math.max(e,s+1),shot:'Plan moyen',angle:'À hauteur des yeux',move:'',action:'',reaction:'',dialogue:''};s=seg.end;return seg}).filter(x=>x.start<d)}
function tlWarnings(st){const w=[];const segs=st.segments;segs.forEach((s,i)=>{if(!(s.end>s.start))w.push(`Séquence ${i+1} : la fin doit être après le début.`);if(i>0&&s.start<segs[i-1].end)w.push(`Séquences ${i} et ${i+1} se chevauchent.`);if(i>0&&s.start>segs[i-1].end)w.push(`Trou entre les séquences ${i} et ${i+1}.`)});if(segs.length&&segs[segs.length-1].end!==Number(st.duration))w.push(`La timeline se termine à ${segs[segs.length-1].end} s pour une durée de ${st.duration} s.`);if(segs.length&&segs[0].start!==0)w.push('La première séquence doit commencer à 0 s.');return w}
function buildVideoPrompt(st){
 const ids=charIds(st.chars);const L=[];const sec=(h,...lines)=>{const c=lines.flat().filter(x=>x!=null&&String(x).trim()!=='');if(c.length)L.push(h,...c,'')};
 const it=INTENSITIES.find(i=>i.id===st.intensity);
 sec('TITLE',st.title.trim()||'Sans titre');
 sec('MOOD',`${st.style}${it?' — ambiance '+it.fr:''}.`);
 sec('DURATION',`${st.duration} secondes.`);
 // reference mapping
 const map=[];let n=1;const refN={};
 if(st.mode==='image'&&st.sourceAsset){map.push(`@image${n} → image de départ : composition, décor et positions à conserver.`);n++}
 st.refs.map(id=>S.assets.find(a=>a.id===id)).filter(Boolean).forEach(a=>{const who=a.partner_id==='couple'?'du couple':'de '+pn(a.partner_id);map.push(`@image${n} → ${catFr(a.category)} ${who}.`);(refN[a.partner_id]=refN[a.partner_id]||[]).push('@image'+n);n++});
 sec('CHARACTER LOCKS',ids.map(p=>{const r=S.partners[p]||{};const v=[r.language,r.accent&&('accent '+r.accent),r.voice].filter(Boolean).join(', ');return `${pn(p)} — identité verrouillée${refN[p]?' sur '+refN[p].join(', '):''}.${v?' Voix : '+v+'.':''}`}));
 sec('REFERENCE IMAGE MAPPING',map);
 if(st.mode==='image'&&st.imageDesc.trim())sec('IMAGE DE DÉPART',st.imageDesc.trim());
 sec('LOCATION',st.location.trim());
 const w=[];ids.forEach(p=>{const o=S.outfits.find(x=>x.id===st.outfits[p]);const free=(st.outfitDesc[p]||'').trim();if(o)w.push(`${pn(p)} : ${o.description||o.name}.`);else if(free)w.push(`${pn(p)} : ${free}.`)});
 sec('WARDROBE',w);
 if(st.idea.trim())sec('OBJECTIF DE LA SCÈNE',st.idea.trim());
 sec('FILM LOOK',st.style+'.');
 sec('LENS',st.lens+'.');
 sec('CAMERA RIG',st.move+'.');
 sec('LIGHTING',(VIDEO_LIGHT[st.style]||'')+'.');
 sec('TIMED SHOTS',st.segments.map(s=>{const cam=[s.shot,s.angle&&s.angle.toLowerCase(),s.move||st.move].filter(Boolean).join(', ');const parts=[`[${s.start}–${s.end} s] ${s.label}`,cam&&`Caméra : ${cam}.`,s.action.trim()&&`Action : ${s.action.trim()}`,s.reaction.trim()&&`Réaction : ${s.reaction.trim()}`,s.dialogue.trim()&&`Dialogue : ${s.dialogue.trim()}`].filter(Boolean);return parts.join(' — ')}));
 const dl=st.segments.filter(s=>s.dialogue.trim()).map(s=>`[${s.start}–${s.end} s] ${s.dialogue.trim()}`);
 if(dl.length)sec('DIALOGUE',`Langue : ${st.language}${st.accent.trim()?', accent '+st.accent.trim():''}. Répliques exactes, mot pour mot :`,dl);
 sec('SOUND',st.sound.trim());
 const cont=[];if(Object.keys(refN).length)cont.push('Identités identiques aux références sur toute la durée.');if(w.length)cont.push('Tenues identiques du début à la fin.');if(st.mode==='image'&&st.sourceAsset)cont.push('Position de départ, décor et lumière identiques à l’image de départ.');
 sec('CONTINUITY',cont);
 sec('VISUAL CONSTRAINTS',st.constraints.trim());
 return L.join('\n').trim();
}

 const imgCreations=S.creations.filter(c=>c.ctype==='image');

 <div class="row"><label class="btn btn-s btn-sm" style="cursor:pointer">${ic('upload',14)} ${st.sourceAsset?'Changer l’image':'Importer une image'}<input type="file" accept="image/*" class="sr" data-scene-img="1"></label>${imgCreations.length?`<span class="xs muted">ou depuis My Library :</span>${imgCreations.slice(0,6).map(c=>`<button class="chip ${st.sourceId===c.id?'on':''}" data-a="vidPick" data-x="${c.id}">${esc(c.title)}</button>`).join('')}`:''}</div>
 ${field('Ce qui est visible dans l’image','vid.imageDesc',st.imageDesc,{area:1,ph:'Décrivez uniquement ce que l’on voit : présence des personnes, positions, actions, décor.'})}
 <p class="xs muted">Analyse automatique de la composition : ${badge('config','À configurer · modèle de vision')}</p></div></div></div>`}
 if(st.mode==='scene'){src=`<div style="margin-top:14px">${scenes.length?`<div class="chips">${scenes.map(c=>`<button class="chip ${st.sourceId===c.id?'on':''}" data-a="vidPickScene" data-x="${c.id}">${esc(c.title)}</button>`).join('')}</div>`:`<div class="drop"><span>Aucune scène dans My Library.</span><a class="btn btn-s btn-sm" href="#/scene">Créer une scène</a></div>`}</div>`}
 return `<div class="ph"><p class="eyebrow">Video Studio</p><h1>Turn your imagination into a <span class="it">cinematic scene.</span></h1><p>Le studio construit un prompt vidéo complet, plan par plan. La génération vidéo réelle est une intégration séparée.</p></div>
 <div class="split"><div>
 <div class="block" style="margin-top:0"><h4><span class="n">1</span> Point de départ</h4>${chipset('vid.mode',st.mode,[{v:'idea',l:'Start from an idea'},{v:'image',l:'Start from an image'},{v:'scene',l:'Start from a scene'},{v:'couple',l:'Start from couple'}])}${src}</div>
 <div class="block"><h4><span class="n">2</span> L’idée</h4><div class="fgrid">${field('Titre','vid.title',st.title,{ph:'Ex. Le dernier verre'})}${field('Lieu','vid.location',st.location,{ph:'Ex. Bar d’hôtel, nuit'})}${field('Objectif de la scène','vid.idea',st.idea,{area:1,full:1,ph:'Ce que la scène doit raconter, en une ou deux phrases.'})}</div></div>
 <div class="block"><h4><span class="n">3</span> Personnages & références</h4>${chipset('vid.chars',st.chars,[{v:'both',l:'Both Partners'},{v:'p1',l:pn('p1')},{v:'p2',l:pn('p2')}])}
 ${pool.length?`<div class="refs" style="margin-top:14px">${pool.map(a=>{const idx=st.refs.indexOf(a.id);return `<div class="ref pick ${idx>-1?'sel':''}" data-a="toggleRef" data-x="${a.id}" data-k="vid" role="button" tabindex="0"><img data-blob="${a.id}" alt=""><div class="rtop"><span class="tag" style="background:rgba(9,9,9,.75)">${esc(a.partner_id==='couple'?'Couple':pn(a.partner_id))} · ${esc(a.category)}</span></div>${idx>-1?`<span class="num">${idx+1+(st.mode==='image'&&st.sourceAsset?1:0)}</span>`:''}</div>`}).join('')}</div>`:`<p class="small muted" style="margin-top:12px">Aucune référence autorisée. <a href="#/couple/visual">Ajouter des photos</a></p>`}
 <div class="fgrid" style="margin-top:16px">${ids.map(p=>{const list=S.outfits.filter(o=>o.partner_id===p);return `<div class="stack" style="gap:10px">${sel('Tenue de '+pn(p),`vid.outfits.${p}`,st.outfits[p],[{v:'',l:'— Aucune —'},...list.map(o=>({v:o.id,l:o.name}))])}${!st.outfits[p]?field('Ou décrire',`vid.outfitDesc.${p}`,st.outfitDesc[p],{opt:1}):''}</div>`}).join('')}</div></div>
 <div class="block"><h4><span class="n">4</span> Paramètres</h4><div class="fgrid">
 ${sel('Durée','vid.duration',st.duration,[5,6,8,10,12,15].map(v=>({v,l:v+' secondes'})),{r:1})}
 ${sel('Format (paramètre fournisseur)','vid.ratio',st.ratio,['9:16','16:9','1:1','4:5'])}
 ${sel('Style cinématographique','vid.style',st.style,VIDEO_STYLES)}
 ${sel('Intensité','vid.intensity',st.intensity,INTENSITIES.map(i=>({v:i.id,l:i.l})))}
 ${sel('Objectif','vid.lens',st.lens,LENSES)}
 ${sel('Mouvement caméra principal','vid.move',st.move,MOVES)}
 ${field('Langue des dialogues','vid.language',st.language)}
 ${field('Accent','vid.accent',st.accent,{opt:1})}
 ${field('Son','vid.sound',st.sound,{opt:1,ph:'Ex. pluie contre la vitre, piano lointain'})}
 ${field('Contraintes visuelles','vid.constraints',st.constraints,{opt:1})}
 </div></div>
 <div class="block" id="timeline"><h4><span class="n">5</span> Timeline de la scène</h4>
 ${st.segments.length?`<div class="tlbar" aria-hidden="true">${st.segments.map((s,i)=>`<div style="flex:${Math.max(.3,(s.end-s.start)/total)};background:${['#650D1D','#A10F27','#7a1427','#C51D3A','#4a0f1a','#8a1a2e'][i%6]}">${s.start}–${s.end}s</div>`).join('')}</div>`:''}

function segEditor(s,i,n){const p=`vid.segments.${i}`;return `<div class="seg"><div class="seg-h"><span class="tc">${s.start}–${s.end} s</span><input class="mini" type="number" min="0" step="1" data-m="${p}.start" value="${s.start}" aria-label="Début"><span class="xs muted">→</span><input class="mini" type="number" min="1" step="1" data-m="${p}.end" value="${s.end}" aria-label="Fin"><input class="lbl" data-m="${p}.label" value="${esc(s.label)}" aria-label="Nom de la séquence">

 <div class="fgrid">${sel('Cadrage',p+'.shot',s.shot,SHOTS)}${sel('Angle',p+'.angle',s.angle,ANGLES)}${sel('Mouvement',p+'.move',s.move,[{v:'',l:'Mouvement principal'},...MOVES])}<span></span>

/* ---------- Create a Scene ---------- */
function blankScene(){return{id:null,fromId:null,title:'',chars:'both',customChars:'',situation:'',relationship:'Couple établi',mood:'Romantic',location:'',wardrobe:{p1:'',p2:''},wardrobeDesc:{p1:'',p2:''},actions:'',cameraLook:'',cameraMove:'Steadicam',duration:10,refs:[],text:'',composed:false}}
function composeScene(st){const ids=charIds(st.chars);const names=st.chars==='custom'?st.customChars:ids.map(pn).join(' et ');const L=[];const add=(k,v)=>{if(v&&String(v).trim())L.push(`${k} : ${String(v).trim()}`)};
 L.push(`SCÈNE — ${st.title.trim()||'Sans titre'}`,'');add('Personnages',names);add('Relation',st.relationship);add('Ambiance',st.mood);add('Lieu',st.location);
 const w=ids.map(p=>{const o=S.outfits.find(x=>x.id===st.wardrobe[p]);const f=(st.wardrobeDesc[p]||'').trim();return o?`${pn(p)} porte ${o.description||o.name}`:f?`${pn(p)} porte ${f}`:null}).filter(Boolean);if(w.length)add('Tenues',w.join(' ; '));
 add('Durée',st.duration+' secondes');add('Caméra',[st.cameraLook,st.cameraMove].filter(Boolean).join(', '));
 if(st.situation.trim())L.push('','SITUATION DE DÉPART',st.situation.trim());if(st.actions.trim())L.push('','ACTIONS',st.actions.trim());
 const refs=st.refs.map(id=>S.assets.find(a=>a.id===id)).filter(Boolean);if(refs.length)L.push('','RÉFÉRENCES',...refs.map((a,i)=>`${i+1}. ${catFr(a.category)} ${a.partner_id==='couple'?'du couple':'de '+pn(a.partner_id)}`));return L.join('\n')}
VIEWS.scene=()=>{V.sc=V.sc||blankScene();const st=V.sc;const ids=charIds(st.chars);

 return `<div class="ph"><p class="eyebrow">Create a Scene</p><h1>Mettez en scène <span class="it">votre moment.</span></h1><p>Une scène construite élément par élément, réutilisable comme image ou comme prompt vidéo.</p></div>
 <div class="split"><div class="stack" style="gap:0">

async function saveCreation({id,ctype,title,text,data,statusLabel,fromId,relation,provider}){
 let rec=id?S.creations.find(c=>c.id===id):null;
 if(rec){rec.versions=rec.versions||[];if(rec.text!==text)rec.versions.push({at:rec.updated_at,text:rec.text,data:rec.data});Object.assign(rec,{title,text,data,statusLabel})}
 else rec={id:uid('cr'),type:'creation',couple_id:'couple',ctype,title,text,data,statusLabel,favorite:false,versions:[],provider:null};
 if(provider)rec.provider=provider;
 await DB.put(rec);

A.imgGenerate=async()=>{const st=V.img;if(!S.settings.kieKey){toast('Ajoute d’abord ta clé kie.ai.','err');return}if(st.busy)return;
 const refs=st.refs.filter(id=>S.assets.some(a=>a.id===id));if(refs.length>8){toast('8 images de référence maximum par génération.','err');return}
 if(!st.prompt.trim()){toast('Le prompt est vide.','err');return}
 st.busy=true;st.err='';st.phase=refs.length?'Envoi des références…':'Création de la tâche…';rerender();
 try{const urls=[];for(const id of refs)urls.push(await KIE.upload(id));
  setPhase('Création de la tâche…');
  const model=S.settings.kieModel||'nano-banana-pro';
  const input={prompt:st.prompt,image_input:urls,aspect_ratio:st.ratio||'auto',resolution:S.settings.kieRes||'2K',output_format:'png'};
  const n=Number(st.count)||1;const tasks=[];for(let i=0;i<n;i++)tasks.push(await KIE.create(model,input));
  setPhase('Génération en cours…');
  const out=await Promise.allSettled(tasks.map((t,i)=>KIE.poll(t,s=>setPhase(`Génération ${n>1?(i+1)+'/'+n+' ':''}: ${STATE_FR[s]||s||'…'}`))));
  const urlsOut=out.filter(o=>o.status==='fulfilled').flatMap(o=>o.value);
  if(!urlsOut.length)throw out.find(o=>o.status==='rejected').reason;
  setPhase('Récupération des images…');
  const results=[];for(const u of urlsOut){let blob=null;try{const r=await fetch(u);if(r.ok){const b=await r.blob();blob=uid('res');await DB.putBlob(blob,b)}}catch(e){}results.push({url:u,blob})}
  st.results=results;st.provider='kie.ai · '+model;st.phase='';
  const failed=out.filter(o=>o.status==='rejected').length;
  if(failed)st.err=`${failed} génération(s) sur ${n} ont échoué : ${out.find(o=>o.status==='rejected').reason.message}`;
  toast(results.length+' image(s) générée(s).','ok');
 }catch(e){st.err=e.message||String(e);st.phase=''}
 finally{st.busy=false;rerender()}};

 if(path.startsWith('set.')){saveSettings({[path.slice(4)]:v});document.body.classList.toggle('rm',!!S.settings.reduceMotion);return}
 setPath(V,path,v);
 if(path==='img.prompt'){V.img.edited=true;return}

 if(path==='sc.text'){V.sc.composed=true;return}
 return true}

 if(p.startsWith('img.'))syncPrompt('img','imgPrompt',buildImagePrompt);

 else if(p.startsWith('sc.')&&!V.sc.composed){V.sc.text=composeScene(V.sc);const t=$('#scText');if(t)t.value=V.sc.text}});

async function handleReplace(el){const f=el.files[0];if(!f||!validFile(f))return;const id=el.dataset.replace;await DB.putBlob(id,f);dropURL(id);const a=S.assets.find(x=>x.id===id);a.name=f.name;await DB.put(a);await refresh();rerender();toast('Photo remplacée.','ok')}

/* ---------- Boot ---------- */
(async()=>{try{await DB.open();await refresh();if(!location.hash)location.hash='#/home';render(true)}catch(err){$('#app').innerHTML=`<div class="splash"><p class="h3">Le stockage local n’est pas disponible.</p><p class="muted small" style="margin-top:10px">Ce navigateur bloque IndexedDB (navigation privée ?). ${esc(err.message||'')}</p></div>`}})();
</script>
