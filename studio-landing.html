<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Landing — Éditeur de pages de vente éditoriales</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ui-bg:#0e1014;--p:#161920;--p2:#1d212b;--bd:#272c38;--tx:#e9ebf1;--mu:#8b92a5;--ac:#e0a96d;--ac2:#f3c892}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ui-bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;line-height:1.45}
.top{height:54px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--bd);background:var(--p)}
.brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}.brand small{color:var(--mu);font-weight:400;margin-left:8px}
.sp{flex:1}
.seg{display:flex;background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:8px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#1a1206;font-weight:600}
.btn2{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}
.btn2:hover{border-color:var(--ac)}
.pri{background:var(--ac);color:#1a1206;border:0;border-radius:10px;padding:9px 16px;font-weight:700}
.pri:hover{background:var(--ac2)}
#saveSt{color:var(--mu);font-size:12px;white-space:nowrap}
.menu{position:relative}
.dd{position:absolute;right:0;top:42px;background:var(--p2);border:1px solid var(--bd);border-radius:10px;min-width:230px;padding:6px;display:none;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.dd.open{display:block}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:7px}
.dd button:hover{background:var(--bd)}
.app{display:grid;grid-template-columns:290px 1fr 350px;height:calc(100% - 54px)}
.left,.right{background:var(--p);overflow:auto}
.left{border-right:1px solid var(--bd)}.right{border-left:1px solid var(--bd)}
.center{min-width:0;position:relative}
.stage{position:absolute;inset:0;padding:16px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;background:radial-gradient(circle at 30% 0%,#171b25,#0b0d11)}
.dev{position:relative;background:#fff;overflow:hidden;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);flex:none}
.dev.mob{border-radius:30px;box-shadow:0 0 0 8px #000,0 20px 60px rgba(0,0,0,.6)}
#pv{border:0;display:block;transform-origin:0 0;background:#fff}
.lh{padding:14px 14px 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.lh small{color:var(--mu);font-weight:400}
#secList{padding:0 10px}
.row{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--bd);background:var(--p2);border-radius:10px;margin-bottom:6px;cursor:pointer;position:relative}
.row.on{border-color:var(--ac);background:#262015}
.row.drag{opacity:.4}
.row.dropB::before,.row.dropA::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--ac);border-radius:3px}
.row.dropB::before{top:-5px}.row.dropA::after{bottom:-5px}
.grip{color:var(--mu);cursor:grab;font-size:16px}
.ico{font-size:18px}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:13px}.rt small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{display:none;gap:2px}
.row:hover .ra,.row.on .ra{display:flex}
.ra button,.lc button{background:none;border:0;padding:3px 5px;border-radius:6px;color:var(--mu);font-size:12px}
.ra button:hover,.lc button:hover{background:var(--bd);color:var(--tx)}
.add{margin:6px 10px 20px;width:calc(100% - 20px);padding:12px;border:1.5px dashed var(--ac);background:none;color:var(--ac);border-radius:10px;font-weight:600}
.add:hover{background:#262015}
.rtabs{display:flex;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--p);z-index:5}
.rtabs button{flex:1;background:none;border:0;padding:13px 6px;color:var(--mu);border-bottom:2px solid transparent}
.rtabs button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
#rBody{padding:14px}
.f{margin-bottom:12px}
.fl{display:block;font-size:12px;color:var(--mu);margin-bottom:5px}
.fh{font-size:11px;color:var(--mu);margin-top:4px}
.f-range .rr{display:flex;align-items:center;gap:10px}.f-range input{padding:0;height:6px;accent-color:var(--ac)}.f-range output{min-width:54px;text-align:right;color:var(--mu);font-size:12px}
.f-chk label{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:13px;margin:0}.f-chk input{width:auto}
.f-color .cr{display:flex;align-items:center;gap:10px}.f-color input{width:46px;height:34px;padding:2px;cursor:pointer}.f-color code{color:var(--mu);font-size:12px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ac);margin:18px 0 10px;font-weight:700}
.grp:first-child{margin-top:0}
.ihead{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bd)}.ihead span{font-size:22px}.ihead small{color:var(--mu);display:block}
.imgf .ir{display:flex;gap:10px;align-items:stretch}
.thumb{width:74px;height:74px;flex:none;border-radius:10px;border:1.5px dashed var(--bd);background:var(--p2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:22px;cursor:pointer}
.thumb.has{border-style:solid;font-size:0}
.thumb.over{border-color:var(--ac)}
.imgf .ic{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.imgf .ib{display:flex;gap:6px}
.imgf .ib button{flex:1;background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:12px}
.imgf .ib button:hover{border-color:var(--ac)}
.imgf input{padding:6px 8px;font-size:12px}
.vidf{border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--p2)}
.vidf .ib{display:flex;gap:6px;margin-bottom:6px}
.vidf .ib button{flex:1;background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:12px}
.vidf .ib button:hover{border-color:var(--ac)}
.vidf .f{margin:10px 0 0}
.vidf input,.vidf select,.vidf textarea{background:var(--p)}
details.li{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--p2)}
details.li summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:9px 10px;gap:8px}
details.li summary::-webkit-details-marker{display:none}
.lt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.lc{display:flex}
.lb{padding:4px 10px 6px;border-top:1px solid var(--bd);padding-top:12px}
.addi{width:100%;background:none;border:1.5px dashed var(--bd);border-radius:10px;padding:9px;color:var(--ac);margin-bottom:12px}
.addi:hover{border-color:var(--ac)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.pc{border:1px solid var(--bd);background:var(--p2);border-radius:10px;padding:8px;text-align:left}
.pc:hover{border-color:var(--ac)}
.pc i{display:flex;height:18px;border-radius:5px;overflow:hidden;margin-bottom:6px}.pc i b{flex:1}
.pc span{font-size:12px}
.hint{color:var(--mu);padding:30px 10px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.mb{background:var(--p);border:1px solid var(--bd);border-radius:16px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:17px;font-weight:700}
.mh button{background:none;border:0;font-size:20px;color:var(--mu)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tc{background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:left}
.tc:hover{border-color:var(--ac);background:#262015}
.tc span{font-size:24px;display:block;margin-bottom:6px}.tc b{display:block}.tc small{color:var(--mu)}
.xa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.xa button{padding:14px;background:var(--p2);border:1px solid var(--bd);border-radius:12px;text-align:left}
.xa button:hover{border-color:var(--ac)}
.xa b{display:block}.xa small{color:var(--mu)}
.steps{margin:0;padding-left:20px;color:var(--mu)}.steps li{margin-bottom:6px}.steps b{color:var(--tx)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ac);color:#1a1206;padding:10px 18px;border-radius:10px;font-weight:600;z-index:200;display:none}
.mtabs{display:none}
@media(max-width:1100px){.app{grid-template-columns:250px 1fr 310px}}
@media(max-width:900px){
 .brand small,#saveSt{display:none}
 .app{display:block;height:calc(100% - 54px - 52px)}
 .left,.center,.right{display:none;height:100%;width:100%;border:0}
 body[data-m=list] .left{display:block}
 body[data-m=view] .center{display:block}
 body[data-m=edit] .right{display:block}
 .mtabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:52px;background:var(--p);border-top:1px solid var(--bd);z-index:20}
 .mtabs button{flex:1;background:none;border:0;color:var(--mu)}
 .mtabs button.on{color:var(--ac);font-weight:700}
 .seg button{padding:6px 8px}
 .xa{grid-template-columns:1fr}
}
</style>
</head>
<body data-m="view">
<header class="top">
  <div class="brand">Studio Landing<small>Pages de vente éditoriales</small></div>
  <div class="sp"></div>
  <span id="saveSt"></span>
  <div class="seg" id="devSeg"><button data-d="desktop" class="on">🖥 Ordinateur</button><button data-d="mobile">📱 Mobile</button></div>
  <div class="menu">
    <button class="btn2" id="btnProj">Projet ▾</button>
    <div class="dd" id="ddProj">
      <button data-a="sample">✨ Page d’exemple</button>
      <button data-a="blank">▫️ Page vide</button>
      <button data-a="import">📂 Ouvrir un projet (.json)</button>
      <button data-a="save">💾 Sauvegarder le projet (.json)</button>
    </div>
  </div>
  <button class="pri" id="btnExport">Exporter / Publier</button>
</header>
<main class="app">
  <aside class="left" id="pLeft">
    <div class="lh">Sections <small id="secCount"></small></div>
    <div id="secList"></div>
    <button class="add" id="btnAdd">＋ Ajouter une section</button>
  </aside>
  <section class="center" id="pCenter">
    <div class="stage" id="stage"><div class="dev" id="dev"><iframe id="pv" title="Aperçu"></iframe></div></div>
  </section>
  <aside class="right" id="pRight">
    <div class="rtabs" id="rTabs"><button data-t="section" class="on">Section</button><button data-t="design">Design</button><button data-t="page">Page</button></div>
    <div id="rBody"></div>
  </aside>
</main>
<nav class="mtabs" id="mTabs"><button data-m="list">☰ Sections</button><button data-m="view" class="on">👁 Aperçu</button><button data-m="edit">⚙️ Réglages</button></nav>
<div class="modal" id="modal"><div class="mb"><div class="mh"><span id="mTitle"></span><button id="mClose">✕</button></div><div id="mBody"></div></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="jsonIn" accept=".json,application/json" hidden>
<input type="file" id="vidIn" accept="video/*" hidden>

<script>
/* ============ Utilitaires ============ */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='value')e.value=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});return e};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inline=h=>h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
const P=t=>String(t||'').split(/\n+/).filter(x=>x.trim()).map(p=>'<p>'+inline(esc(p))+'</p>').join('');
const safe=u=>{u=(u||'').trim();return /^\s*(javascript|data):/i.test(u)?'#':(u||'#')};
const lum=h=>{h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const[r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b};
const on=h=>lum(h)>.32?'#161616':'#ffffff';
const blobToDataUrl=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
const dataUrlToBlob=u=>fetch(u).then(r=>r.blob());
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2400)}

/* ============ Thème ============ */
const FONTS_H=['Playfair Display','Cormorant Garamond','Fraunces','Bodoni Moda','Syne','Space Grotesk','Poppins','Montserrat','Inter','DM Sans','Lora'];
const FONTS_B=['Inter','DM Sans','Poppins','Lora','Karla','Work Sans','Montserrat','Nunito Sans'];
const fontsUrl=t=>'https://fonts.googleapis.com/css2?'+[...new Set([t.fh,t.fb])].map(n=>'family='+n.replace(/ /g,'+')+':wght@400;700').join('&')+'&display=swap';
const PRESETS=[
 {n:'Magazine crème',t:{bg:'#faf6ef',surface:'#f0e8da',text:'#2a2420',accent:'#b4623a',dark:'#2a2420',fh:'Playfair Display',fb:'Inter',hw:'400'}},
 {n:'Noir & or',t:{bg:'#0e0e10',surface:'#17171b',text:'#f3efe6',accent:'#c9a45c',dark:'#050506',fh:'Cormorant Garamond',fb:'DM Sans',hw:'700'}},
 {n:'Rose poudré',t:{bg:'#fff7f5',surface:'#fbe4e0',text:'#3a2530',accent:'#d9677b',dark:'#3a2530',fh:'Fraunces',fb:'Karla',hw:'400'}},
 {n:'Vert sauge',t:{bg:'#f4f6f1',surface:'#e3e9dc',text:'#1f2a22',accent:'#4f7a5a',dark:'#1f2a22',fh:'Lora',fb:'Work Sans',hw:'700'}},
 {n:'Contraste vif',t:{bg:'#ffffff',surface:'#f3f3f3',text:'#111111',accent:'#ff4d2e',dark:'#111111',fh:'Syne',fb:'Space Grotesk',hw:'700'}},
 {n:'Bleu nuit',t:{bg:'#f6f7fb',surface:'#e4e8f4',text:'#141a33',accent:'#3d5afe',dark:'#0f1530',fh:'DM Sans',fb:'Inter',hw:'700'}}
];
const DEFAULT_THEME={...PRESETS[0].t,hs:1,pad:110,maxw:1140,gap:24,radius:6,btn:'pill',anim:true};
const BTN_R={pill:'999px',round:'10px',square:'0'};

function pageCss(t){return `
:root{--bg:${t.bg};--surface:${t.surface};--text:${t.text};--accent:${t.accent};--accent-text:${on(t.accent)};--dark:${t.dark};--dark-text:${on(t.dark)};--fh:'${t.fh}';--fb:'${t.fb}';--hw:${t.hw};--hs:${t.hs};--pad:${t.pad}px;--maxw:${t.maxw}px;--gap:${t.gap}px;--radius:${t.radius}px;--btn-r:${BTN_R[t.btn]||'999px'}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb),system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
.s{position:relative;background:var(--s-bg);color:var(--s-fg);padding:calc(var(--pad)*var(--k,1)) 0}
.bg-default{--s-bg:var(--bg);--s-fg:var(--text);--s-card:var(--surface);--s-btn:var(--accent);--s-btn-fg:var(--accent-text);--s-ey:var(--accent)}
.bg-surface{--s-bg:var(--surface);--s-fg:var(--text);--s-card:var(--bg);--s-btn:var(--accent);--s-btn-fg:var(--accent-text);--s-ey:var(--accent)}
.bg-dark{--s-bg:var(--dark);--s-fg:var(--dark-text);--s-card:color-mix(in srgb,var(--dark-text) 9%,var(--dark));--s-btn:var(--accent);--s-btn-fg:var(--accent-text);--s-ey:var(--accent)}
.bg-accent{--s-bg:var(--accent);--s-fg:var(--accent-text);--s-card:color-mix(in srgb,var(--accent-text) 12%,var(--accent));--s-btn:var(--accent-text);--s-btn-fg:var(--accent);--s-ey:var(--accent-text)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.muted{color:color-mix(in srgb,var(--s-fg) 68%,transparent)}
.eyebrow{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--s-ey);margin-bottom:1rem}
.t{font-family:var(--fh),Georgia,serif;font-weight:var(--hw);line-height:1.08;letter-spacing:-.015em;font-size:calc(clamp(2rem,4.6vw,3.4rem)*var(--hs))}
.sub{font-size:clamp(1.05rem,1.6vw,1.3rem);margin-top:1rem;line-height:1.5}
.txt{margin-top:1.25rem;max-width:62ch}.txt p+p{margin-top:1em}
.head{max-width:760px;margin:0 auto calc(var(--gap)*2.5);text-align:center}.head .txt{margin-inline:auto}
.btn{display:inline-block;margin-top:1.75rem;padding:.95em 2em;background:var(--s-btn);color:var(--s-btn-fg);border-radius:var(--btn-r);text-decoration:none;font-weight:700;letter-spacing:.04em;font-size:.95rem;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.im{overflow:hidden;border-radius:var(--radius);position:relative}
.im img,.im .ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 38%,var(--surface)),color-mix(in srgb,var(--dark) 28%,var(--surface)))}
.badge{display:inline-block;align-self:flex-start;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;background:var(--s-btn);color:var(--s-btn-fg);padding:.3em .9em;border-radius:99px}
.ov{position:absolute;inset:0;background:#000;opacity:var(--ov,.5)}
/* hero */
.hero{padding:0;min-height:calc(var(--vh,85)*1vh);display:flex;align-items:var(--va,flex-end);color:#fff;overflow:hidden}
.hero .hm{position:absolute;inset:0}.hero .hm .im{height:100%;border-radius:0}
.hero .ov{background:linear-gradient(to top,#000,rgba(0,0,0,.25))}
.hero .wrap{position:relative;width:100%;padding-top:120px;padding-bottom:clamp(48px,9vh,110px)}
.hero .t{font-size:calc(clamp(2.5rem,7vw,5.6rem)*var(--hs));max-width:16ch}
.hero .eyebrow{color:#fff}.hero .muted{color:rgba(255,255,255,.86)}
.hero.c .wrap{text-align:center}.hero.c .t{margin-inline:auto}.hero.c .txt{margin-inline:auto}
/* split */
.split .g{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--gap)*2.5);align-items:center}
.split.r .md{order:2}
.shape-arch .im{border-radius:999px 999px var(--radius) var(--radius)}.shape-oval .im{border-radius:50%}
/* mosaic */
.mos{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(140px,17vw,240px);gap:var(--gap);grid-auto-flow:dense}
.mos figure{position:relative;margin:0;min-height:0}.mos .im{height:100%}
.mos figure:nth-child(6n+1){grid-column:span 2;grid-row:span 2}
.mos figure:nth-child(6n+3){grid-row:span 2}
.mos figure:nth-child(6n+5){grid-column:span 2}
.mos.u{grid-template-columns:repeat(3,1fr);grid-auto-rows:auto}
.mos.u figure{grid-column:auto!important;grid-row:auto!important;aspect-ratio:1}
.mos figure.hc .im::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.6))}
.mos figcaption{position:absolute;left:14px;right:14px;bottom:12px;color:#fff;font-size:.88rem;font-weight:600;z-index:2}
/* galerie */
.gal figure{margin:0}.cp2{font-size:.85rem;margin-top:.5rem}
.gal.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap)}
.gal.scroll{display:flex;gap:var(--gap);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.gal.scroll figure{flex:0 0 min(82%,420px);scroll-snap-align:start}
.gal.stack{display:grid;gap:calc(var(--gap)*2)}
/* superposés */
.ov-g{display:grid;grid-template-columns:repeat(12,1fr);align-items:center}
.ov-m{grid-column:1/9;grid-row:1;position:relative}
.ov-c{grid-column:7/13;grid-row:1;position:relative;z-index:2;background:var(--s-card);padding:clamp(28px,4vw,56px);border-radius:var(--radius);box-shadow:0 30px 60px -20px rgba(0,0,0,.28)}
.ov-sm{position:absolute;left:-5%;bottom:-9%;width:30%;z-index:3;border:8px solid var(--s-bg);border-radius:calc(var(--radius) + 6px);background:var(--s-bg)}
.ov.l .ov-m{grid-column:5/13}.ov.l .ov-c{grid-column:1/7}.ov.l .ov-sm{left:auto;right:-5%}
/* numérotées */
.nm-i{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--gap)*2.5);align-items:center;margin-top:calc(var(--gap)*3.5)}
.nm-i.rev .nm-m{order:2}
.num{font-family:var(--fh),Georgia,serif;font-size:clamp(4rem,9vw,7.5rem);line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--s-ey);font-weight:var(--hw);margin-bottom:.4rem}
.nm-i.lst{grid-template-columns:clamp(90px,14vw,170px) 1fr;border-top:1px solid color-mix(in srgb,var(--s-fg) 18%,transparent);padding-top:calc(var(--gap)*1.5);margin-top:calc(var(--gap)*1.5);align-items:start}
.nm-i.lst .num{margin:0}
/* fiches */
.ft{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap)}
.ft-c{background:var(--s-card);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.ft.plain .ft-c{background:none;border-radius:0}.ft.plain .ft-b{padding-left:0;padding-right:0}
.ft-c .im{border-radius:0}.ft.plain .ft-c .im{border-radius:var(--radius)}
.ft-b{padding:1.5rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.ft-t{font-family:var(--fh),Georgia,serif;font-size:1.4rem;line-height:1.2;font-weight:var(--hw)}
.ft-b .price{font-weight:700;font-size:1.15rem}
.lnk{margin-top:auto;padding-top:.6rem;font-weight:700;text-decoration:underline;text-underline-offset:4px;color:inherit}
/* témoignages */
.tm{columns:var(--cols);column-gap:var(--gap)}
.tm-c{break-inside:avoid;background:var(--s-card);border-radius:var(--radius);padding:1.7rem;margin:0 0 var(--gap)}
.stars{color:var(--s-ey);letter-spacing:.15em;font-size:1.05rem}
.tm-q{margin:.8rem 0 1rem}.tm-q p+p{margin-top:.7em}
.tm-sh{margin:1rem 0;border-radius:calc(var(--radius)*.8);overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.16)}.tm-sh img{width:100%;height:auto}
.au{display:flex;align-items:center;gap:.8rem}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none}.av .im{border-radius:50%;height:100%}
.av.in{display:flex;align-items:center;justify-content:center;background:var(--s-btn);color:var(--s-btn-fg);font-weight:700}
.au b{display:block;line-height:1.2}.au span{font-size:.85rem}
.tm.big{columns:1;max-width:820px;margin:0 auto;text-align:center}
.tm.big .tm-c{background:none;padding:0 0 calc(var(--gap)*2)}
.tm.big .tm-q{font-family:var(--fh),Georgia,serif;font-size:clamp(1.3rem,2.6vw,2rem);line-height:1.35;font-weight:var(--hw)}
.tm.big .au{justify-content:center}.tm.big .tm-sh{max-width:420px;margin-inline:auto}
/* prix */
.pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:var(--gap);align-items:stretch;margin:0 auto}
.pr.n1{max-width:460px}.pr.n2{max-width:840px}
.pr-c{background:var(--s-card);border:1px solid color-mix(in srgb,var(--s-fg) 14%,transparent);border-radius:var(--radius);padding:2.2rem 2rem 2rem;display:flex;flex-direction:column;gap:.6rem;position:relative}
.pr-c.hl{border:2px solid var(--s-ey);box-shadow:0 24px 50px -20px rgba(0,0,0,.35)}
.pr-c .badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap}
.pr-n{font-family:var(--fh),Georgia,serif;font-size:1.5rem;font-weight:var(--hw)}
.pr-p{font-family:var(--fh),Georgia,serif;font-size:3.2rem;line-height:1.05;font-weight:var(--hw)}
.pr-p small{font-family:var(--fb),sans-serif;font-size:.9rem;opacity:.65;font-weight:400;margin-left:.4rem}
.old{text-decoration:line-through;opacity:.5;font-size:1.2rem;margin-left:.6rem;font-weight:400}
.pr-l{list-style:none;padding:0;margin:.8rem 0 0;display:grid;gap:.55rem;flex:1;align-content:start}
.pr-l li{padding-left:1.7rem;position:relative}
.pr-l li::before{content:"✓";position:absolute;left:0;color:var(--s-ey);font-weight:700}
.pr-c .btn{width:100%;text-align:center;margin-top:1.4rem}
.note{text-align:center;margin-top:2rem;font-size:.9rem}
/* cta */
.cta{overflow:hidden}
.cta .bgm{position:absolute;inset:0}.cta .bgm .im{height:100%;border-radius:0}
.cta .wrap{position:relative;text-align:center}.cta .txt{margin-inline:auto}.cta .t{max-width:20ch;margin-inline:auto}
.cta.hasimg{color:#fff}.cta.hasimg .muted{color:rgba(255,255,255,.85)}
.cta .note{margin-top:1.2rem}
/* vidéo */
.vd{position:relative;width:100%;max-width:var(--vw,100%);margin-inline:auto;border-radius:var(--radius);overflow:hidden;background:#000}
.vd.v9{max-width:min(var(--vw,100%),420px)}
.vd>*{position:absolute;inset:0;width:100%;height:100%}
.vd.fill,.vd.bg{position:absolute;inset:0;aspect-ratio:auto!important;max-width:none!important;border-radius:0}
.vd-cv{object-fit:cover;display:block}
.vd-ph{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 38%,var(--surface)),color-mix(in srgb,var(--dark) 28%,var(--surface)))}
.vd-pl{border:0;background:rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .2s}
.vd-pl:hover{background:rgba(0,0,0,.34)}
.vd-pl span{width:76px;height:76px;max-width:22%;max-height:22%;min-width:48px;min-height:48px;border-radius:50%;background:var(--accent);box-shadow:0 8px 28px rgba(0,0,0,.35);position:relative;display:block;transition:transform .2s}
.vd-pl:hover span{transform:scale(1.08)}
.vd-pl span::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-36%,-50%);border-left:20px solid var(--accent-text);border-top:13px solid transparent;border-bottom:13px solid transparent}
.vd video,.vd iframe{border:0;object-fit:cover;background:#000}
.vd-tg{background:none;border:0;padding:0;cursor:pointer}
.vd.on .vd-pl,.vd.on .vd-cv{display:none}
.vd.on.ps .vd-pl{display:flex}
.vd.bg .vd-pl,.vd.bg .vd-tg{display:none}
.vd.bg iframe{inset:auto;left:50%;top:50%;width:max(100%,177.78vh);height:max(100%,56.25vw);transform:translate(-50%,-50%)}
.vfoot{text-align:center;margin-top:calc(var(--gap)*1.5)}.vfoot .txt{margin-inline:auto}
.vbleed .vd{border-radius:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:center}.pair .vd{max-width:100%}
.video .g{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--gap)*2.5);align-items:center}
.video.r .md{order:2}
.tm-vd{margin:0 0 1rem}
.gal figure .lnk{display:inline-block;margin-top:.3rem;padding-top:0}
.ft-c{position:relative;transition:transform .25s}
.ft-c .lnk.st::after{content:"";position:absolute;inset:0}
.ft-c .lnk:empty{padding:0;height:0}
.ft-c:has(.lnk.st):hover{transform:translateY(-4px)}
/* responsive */
@media(max-width:960px){.ft{grid-template-columns:repeat(2,1fr)}.tm:not(.big){columns:2}}
@media(max-width:760px){
 .s{padding:calc(var(--pad)*var(--k,1)*.55) 0}.hero{padding:0}
 .split .g{grid-template-columns:1fr}.split.r .md{order:0}
 .video .g,.pair{grid-template-columns:1fr}.video.r .md{order:0}
 .mos{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}.mos.u{grid-template-columns:repeat(2,1fr)}
 .gal.grid{grid-template-columns:repeat(2,1fr)}
 .ov-g{display:block}.ov-m,.ov.l .ov-m{grid-column:auto}
 .ov-c{margin:-56px 14px 0;padding:28px}
 .ov-sm,.ov.l .ov-sm{bottom:auto;top:14px;right:14px;left:auto;width:34%}
 .nm-i{grid-template-columns:1fr;gap:var(--gap)}.nm-i.rev .nm-m{order:0}.nm-i.lst{grid-template-columns:72px 1fr}
 .ft{grid-template-columns:1fr}.tm,.tm:not(.big){columns:1}
 .pr-p{font-size:2.7rem}
}
${t.anim?`.js .rv{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}.js .rv.in{opacity:1;transform:none}`:''}
`}

const VIDEO_JS=`(function(){

function build(d,mode){

 var p=d.dataset.p,s=d.dataset.s,bg=d.classList.contains('bg'),ctl=d.dataset.ctl==='1',lp=d.dataset.loop==='1',au=mode==='auto'||bg,el;

  el=document.createElement('video');el.src=s;el.setAttribute('playsinline','');el.playsInline=true;el.preload='auto';el.controls=ctl;el.loop=lp;el.muted=au;
  d.appendChild(el);var pr=el.play();if(pr&&pr.catch)pr.catch(function(){d.classList.add('ps')});
  el.addEventListener('pause',function(){if(!ctl)d.classList.add('ps')});el.addEventListener('play',function(){d.classList.remove('ps')});

  el=document.createElement('iframe');el.allow='autoplay; fullscreen; picture-in-picture';el.allowFullscreen=true;el.title='Vidéo';
  if(p==='yt'){var o={autoplay:1,controls:ctl?1:0,rel:0,modestbranding:1,playsinline:1,enablejsapi:1};if(au)o.mute=1;if(lp){o.loop=1;o.playlist=s}if(bg)o.disablekb=1;el.src=Y+s+'?'+q(o)}
  else{var o2={autoplay:1,controls:ctl?1:0,dnt:1,playsinline:1};if(au)o2.muted=1;if(lp)o2.loop=1;if(bg)o2.background=1;if(d.dataset.h)o2.h=d.dataset.h;el.src=V+s+'?'+q(o2)}
  d.appendChild(el);d.__st=true;

}
function toggle(d){
 var el=d.__el,p=d.dataset.p;if(!el)return;
 if(p==='file'){if(el.paused)el.play();else el.pause();return}
 if(d.__st){post(el,p,'pause');d.classList.add('ps')}else{post(el,p,'play');d.classList.remove('ps')}

});

/* ============ Résolution des images ============ */
let state={page:null,assets:{}};
const urls={};
const assetUrl=id=>{if(!urls[id]&&state.assets[id])urls[id]=URL.createObjectURL(state.assets[id]);return urls[id]||''};
let rsv=v=>{if(!v)return '';if(String(v).startsWith('asset:'))return assetUrl(v.slice(6));return v};

/* ============ Blocs de rendu ============ */
const IM=(src,alt='',st='')=>`<div class="im" style="${esc(st)}">${src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:'<div class="ph"></div>'}</div>`;
const eb=t=>t?`<p class="eyebrow">${esc(t)}</p>`:'';
const ti=(t,tag='h2')=>t?`<${tag} class="t">${inline(esc(t))}</${tag}>`:'';
const sb=t=>t?`<p class="sub muted">${inline(esc(t))}</p>`:'';
const tx=t=>t&&t.trim()?`<div class="txt">${P(t)}</div>`:'';
const bt=(l,u)=>l?`<a class="btn" href="${esc(safe(u))}">${esc(l)}</a>`:'';
const head=s=>(s.eyebrow||s.title||s.sub)?`<div class="head">${eb(s.eyebrow)}${ti(s.title)}${sb(s.sub)}</div>`:'';
const list=a=>Array.isArray(a)?a:[];
const slug=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const vdef=(ratio='16/9')=>({src:'',cover:'',ratio,size:100,controls:true,autoplay:false,loop:false});
function parseVid(u){
 u=(u||'').trim();if(!u)return null;if(u.startsWith('asset:'))return {p:'file',s:u};
 let m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);if(m)return {p:'yt',s:m[1]};
 m=u.match(/vimeo\.com\/(?:video\/|channels\/[^/]+\/|groups\/[^/]+\/videos\/)?(\d+)(?:\/([a-f0-9]+))?/);if(m)return {p:'vm',s:m[1],h:m[2]||''};
 return {p:'file',s:u};
}
function VID(v,alt='',o={}){
 if(!v||!v.src)return '';
 const pv=parseVid(v.src);if(!pv)return '';
 const ratio=v.ratio||'16/9',size=Math.min(100,Math.max(20,+v.size||100));
 const src=pv.p==='file'?rsv(pv.s):pv.s;
 const cover=v.cover?rsv(v.cover):(pv.p==='yt'?`https://i.ytimg.com/vi/${pv.s}/hqdefault.jpg`:'');
 const cv=cover?`<img class="vd-cv" src="${esc(cover)}" alt="${esc(alt)}" loading="lazy">`:(pv.p==='file'?`<video class="vd-cv" src="${esc(src)}#t=0.1" preload="metadata" muted playsinline></video>`:'<div class="vd-cv vd-ph"></div>');
 const A=(k,x)=>` data-${k}="${esc(x)}"`;
 const cls='vd'+(ratio==='9/16'?' v9':'')+(o.fill?' fill':'')+(o.bg?' bg':'');
 return `<div class="${cls}" style="aspect-ratio:${esc(ratio)};--vw:${size}%" data-vd${A('p',pv.p)}${A('s',src)}${pv.h?A('h',pv.h):''}${A('ctl',v.controls===false?0:1)}${A('auto',v.autoplay?1:0)}${A('loop',v.loop?1:0)}>${cv}<button class="vd-pl" type="button" aria-label="Lire la vidéo"><span></span></button></div>`;
}
const MEDIA=(img,video,alt,st,fill,vph)=>video&&video.src?(fill?`<div class="im" style="${esc(st)}">${VID(video,alt,{fill:1})}</div>`:VID(video,alt)):(vph?`<div class="im" style="${esc(st)}"><div class="vd-ph vd-empty" style="position:absolute;inset:0"></div></div>`:IM(rsv(img),alt,st));

/* ============ Images : import + compression ============ */
async function addImage(file){
 let blob=file;
 const keep=/gif|svg/.test(file.type)||(file.type==='image/png'&&file.size<800000);
 if(!keep){
  const u=URL.createObjectURL(file);const img=new Image();
  await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=u});
  const max=2000;const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(u);
  blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.86));
 }
 const id=uid();state.assets[id]=blob;return id;
}

 else if(a==='save')saveProject();
 else if(confirm('Remplacer la page actuelle ? (pense à sauvegarder le projet avant)')){state={page:a==='sample'?starter():blank(),assets:{}};sel=state.page.sections[0]?.id||null;rtab='section';renderAll()}};
$('#devSeg').onclick=e=>{const d=e.target.dataset.d;if(!d)return;dev=d;document.querySelectorAll('#devSeg button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));fit()};
$('#rTabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;rtab=t;renderRight()};
$('#mTabs').onclick=e=>{const m=e.target.dataset.m;if(m)setM(m)};
new ResizeObserver(fit).observe($('#stage'));
addEventListener('beforeunload',()=>{clearTimeout(tSave);save()});

/* ============ Démarrage ============ */
(async()=>{
 try{const saved=await DB.get('project');if(saved&&saved.page)state={page:migrate(saved.page),assets:saved.assets||{}}}catch(e){}
 if(!state.page)state={page:starter(),assets:{}};
 sel=state.page.sections[0]?.id||null;
 renderList();renderRight();initPreview();fit();setSt('');
})();
</script>
</body>
</html>
