<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio IRL – Tous les studios</title>
<style>
  :root{--bg:#0f0f14;--card:#1a1a23;--line:#2a2a36;--txt:#f4f4f7;--mut:#9a9aab;--acc:#ff4d6d;--acc2:#7c5cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:32px 16px 64px}
  .wrap{max-width:1000px;margin:0 auto}
  header{text-align:center;margin-bottom:28px}
  h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--mut);margin-top:8px;font-size:16px}
  .search{display:block;width:100%;max-width:420px;margin:20px auto 0;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;outline:none}
  .search:focus{border-color:var(--acc2)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut);margin:32px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  a.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--txt);transition:.15s}
  a.card:hover{transform:translateY(-2px);border-color:var(--acc)}
  .ico{font-size:24px;flex:none}
  .name{font-weight:600;font-size:16px}
  .arrow{margin-left:auto;color:var(--acc);font-size:18px}
  .empty{display:none;text-align:center;color:var(--mut);margin-top:32px}
  footer{text-align:center;color:var(--mut);font-size:13px;margin-top:48px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Studio IRL</h1>
    <p>Tous tes studios au même endroit — un clic et tu y es.</p>
    <input class="search" id="q" type="search" placeholder="Rechercher un studio…" autocomplete="off">
  </header>
  <div id="list"></div>
  <p class="empty" id="empty">Aucun studio trouvé.</p>
  <footer>Studio IRL - Apprends à créer un alter ego IA auquel ton audience peut s'attacher.</footer>
</div>

<script>
// ============ À MODIFIER ICI UNIQUEMENT ============
// Pour ajouter un studio : copie une ligne, change le nom et le lien.
const B = "https://studioirl.github.io/studio_irl/";
const ADN = { ico:"💎", nom:"Studio ADN", url:"https://gemini.google.com/gem/bc30601520b8?usp=sharing" };
const PSYCHO = { ico:"💎", nom:"Studio Psycho", url:"https://gemini.google.com/gem/e6c5d2755816?usp=sharing" };
const LABO = { ico:"🧬", nom:"Studio Labo", url: B+"studio-labo-flash.html" };

const CATEGORIES = [
  { titre: "Création d'avatar", studios: [
    ADN,
    LABO,
    { ico:"👯", nom:"Studio Twin", url: B+"studio-twin-dual.html" },
    { ico:"💪", nom:"Studio Body", url: B+"studio-body-vertex2.html" },
    { ico:"🍑", nom:"Studio Popotin", url: B+"studio-popotin-dual-vertex.html" },
    { ico:"🧬", nom:"Studio Génétique", url: B+"studio-genetique-flash.html" }
  ]},
  { titre: "Vidéo & mise en scène", studios: [
    { ico:"🎥", nom:"Studio Cinéma Duo", url: B+"studio-duo-cinema2.html" },
    { ico:"🎙️", nom:"Studio Production", url: B+"studio-production-duo2.html" },
    { ico:"💋", nom:"Studio Lips", url: B+"studio-lips.html" }
  ]},
  { titre: "Images & moments de vie", studios: [
    { ico:"🎬", nom:"Studio Scène Duo", url: B+"studio-scene-duo2.html" },
    { ico:"👁️", nom:"Studio POV", url: B+"studio-pov-regard-irl.html" },
    LABO
  ]},
  { titre: "Maison & famille", studios: [
    { ico:"🏛️", nom:"Studio Architecte", url: B+"studio-architecte-travaux.html" },
    { ico:"🏠", nom:"Studio Family Home", url: B+"studio-familly-home-dual2.html" }
  ]},
  { titre: "Psychologie", studios: [
    { ico:"🧠", nom:"Studio Perception", url: B+"studio-perception15.html" },
    { ico:"📖", nom:"Studio Narratif", url: B+"studio-narratif-kei-ai.html" },
    PSYCHO
  ]}
];
// ===================================================

const list = document.getElementById("list");
const empty = document.getElementById("empty");
const q = document.getElementById("q");

function render(filter=""){
  const f = filter.trim().toLowerCase();
  list.innerHTML = "";
  let total = 0;
  CATEGORIES.forEach(cat=>{
    const items = cat.studios.filter(s => s.nom.toLowerCase().includes(f));
    if(!items.length) return;
    total += items.length;
    const h = document.createElement("h2"); h.textContent = cat.titre;
    const g = document.createElement("div"); g.className = "grid";
    items.forEach(s=>{
      const a = document.createElement("a");
      a.className = "card"; a.href = s.url; a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = `<span class="ico">${s.ico}</span><span class="name">${s.nom}</span><span class="arrow">→</span>`;
      g.appendChild(a);
    });
    list.append(h,g);
  });
  empty.style.display = total ? "none" : "block";
}
q.addEventListener("input", e => render(e.target.value));
render();
</script>
</body>
</html>
